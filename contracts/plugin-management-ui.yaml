version: 4
description: >
  Plugin management pages are readonly static artifact files served on the
  management origin under a per-plugin path and embedded in an iframe. Pages
  call the management API directly with the operator session; the response
  Content-Security-Policy limits scripts to the plugin UI path, or to the
  management origin when the request Host is an IPv6 literal. Images and media
  may also load from any HTTPS origin; styles, fonts and requests stay on the
  management origin.

x-fixtures:
  - fixtures/plugin-management-ui/ok.static-route.yaml
  - fixtures/plugin-management-ui/invalid.static-route-parent-escape.yaml
  - fixtures/plugin-management-ui/edge.ipv6-host-script-src.yaml

static_route:
  path_template: /plugin-ui/{plugin_id}/{asset_path}
  methods:
    - GET
    - HEAD
  auth: public_readonly
  redirects: none
  plugin_requirements:
    valid: true
    installed: true
    artifact_verified: true
    management_ui_declared: true
  asset_scope:
    root: ui
    empty_asset_path: management_ui.entry
    allow_directory_listing: false
    allow_parent_escape: false
  response_headers:
    cache_control_html: no-store
    cache_control_hashed_asset: public, max-age=31536000, immutable
    content_security_policy:
      default-src: "'none'"
      script-src: "{request_host}/plugin-ui/{plugin_id}/"
      style-src: "'self' 'unsafe-inline'"
      img-src: "'self' data: https:"
      media-src: "'self' data: https:"
      font-src: "'self'"
      connect-src: "'self'"
      object-src: "'none'"
      base-uri: "'none'"
      form-action: "'self'"
      frame-ancestors: "'self'"
    content_security_policy_ipv6_literal_host:
      script-src: "'self'"
      reason: CSP host-source expressions cannot contain IPv6 literals; external and inline scripts stay blocked, but scripts are no longer limited to the plugin UI path.
    x_content_type_options: nosniff
    referrer_policy: same-origin
  denied_behavior:
    missing_plugin: 404
    missing_management_ui: 404
    invalid_asset_path: 404
    method_not_allowed: 404

page_context:
  description: >
    The host embeds each management page with query parameters on its iframe
    URL. They identify the page and, on bot_account pages, the selected bot
    account; they never carry profile data. Other query parameters are host
    cache and reload keys that pages must not depend on.
  query_parameters:
    page:
      required: true
      description: Declared page ID from management_ui.pages[].id.
    bot:
      required_when: page scope is bot_account
      format: "<source_protocol>:<bot_id>"
      description: >
        Selected bot account, split at the first colon. source_protocol is
        onebot11 or qqofficial and bot_id is used verbatim. Absent on global
        pages. Switching accounts reloads the iframe with the new value, so
        pages keep caches, drafts and pending results per account and never
        apply a result to another account.
  account_profile: >
    Pages read nickname, current connection and state from
    GET /api/bot-accounts/{source_protocol}/{bot_id}. The profile can change
    while the page is open; delivery never depends on it.
  management_actions: >
    Actions from a bot_account page send page_id and bot in the request to
    POST /api/plugins/{plugin_id}/management/actions; global pages may send
    page_id and never send bot. The host rejects an undeclared page, a missing
    or unexpected bot and an account outside the directory before delivery.
  trust: >
    Page scope and the selected account are not an authorization boundary.
    Same-origin pages and signed-in clients can build any request, including
    one without page_id. Plugins require the account wherever an action needs
    one and check that every record they read or change belongs to it.

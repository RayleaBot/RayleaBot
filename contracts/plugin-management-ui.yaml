version: 4
description: >
  Plugin management pages are readonly static artifact files served on the
  management origin under a per-plugin path and embedded in an iframe. Pages
  call the management API directly with the operator session; the response
  Content-Security-Policy limits scripts to the plugin UI path.

x-fixtures:
  - fixtures/plugin-management-ui/ok.static-route.yaml
  - fixtures/plugin-management-ui/invalid.static-route-parent-escape.yaml

static_route:
  path_template: /plugin-ui/{plugin_id}/{asset_path}
  methods:
    - GET
    - HEAD
  auth: public_readonly
  redirects: none
  plugin_requirements:
    valid: true
    installed: true
    artifact_verified: true
    management_ui_declared: true
  asset_scope:
    root: ui
    empty_asset_path: management_ui.entry
    allow_directory_listing: false
    allow_parent_escape: false
  response_headers:
    cache_control_html: no-store
    cache_control_hashed_asset: public, max-age=31536000, immutable
    content_security_policy:
      default-src: "'none'"
      script-src: "{request_host}/plugin-ui/{plugin_id}/"
      style-src: "'self' 'unsafe-inline'"
      img-src: "'self' data:"
      font-src: "'self'"
      connect-src: "'self'"
      object-src: "'none'"
      base-uri: "'none'"
      form-action: "'self'"
      frame-ancestors: "'self'"
    x_content_type_options: nosniff
    referrer_policy: same-origin
  denied_behavior:
    missing_plugin: 404
    missing_management_ui: 404
    invalid_asset_path: 404
    method_not_allowed: 404

version: 1
description: >
  Fixture-ready WebSocket contract. This file freezes the shared
  envelope and the smallest set of server-push event types needed by the
  management surface.
x-fixtures:
  - fixtures/websocket/edge.events-received-plugin-initialization-failed.json
  - fixtures/websocket/ok.logs-appended.json
  - fixtures/websocket/ok.logs-appended.outbound-onebot11.json
  - fixtures/websocket/ok.logs-appended.task.json
  - fixtures/websocket/ok.logs-appended.protocol-onebot11.json
  - fixtures/websocket/ok.logs-appended.protocol-qqofficial.json
  - fixtures/websocket/ok.plugins-console-stderr.json
  - fixtures/websocket/ok.events-received-bridge-runtime-observability.json
  - fixtures/websocket/ok.events-received-dispatcher-runtime-observability.json
  - fixtures/websocket/ok.events-received-protocol-snapshot.json
  - fixtures/websocket/ok.events-received-adapters-snapshot.json
  - fixtures/websocket/ok.events-received-service-running.json
  - fixtures/websocket/ok.events-received-service-stopping.json
  - fixtures/websocket/ok.events-received-service-restarting.json
  - fixtures/websocket/invalid.events-received-running-stop-intent.json
  - fixtures/websocket/ok.events-received-governance-changed.json
  - fixtures/websocket/ok.events-received-message-stats-changed.json
  - fixtures/websocket/invalid.events-received-message-stats-counts.json
  - fixtures/websocket/edge.events-received-degraded.json
  - fixtures/websocket/edge.events-received-bridge-runtime-zeroed.json
  - fixtures/websocket/edge.events-received-plugin-crashed.json
  - fixtures/websocket/edge.session-expired.json
  - fixtures/websocket/invalid.events-received-plugin-invalid-state.json
  - fixtures/websocket/invalid.events-received-raw-chat.json
  - fixtures/websocket/invalid.events-received-bridge-runtime-raw-leak.json

admission:
  authentication:
    accepted: [cookie, authorization_header]
    cookie_name: raylea_session
    authorization_scheme: Bearer
    forbidden: [query_token, query_session_token]
  origin:
    required_for_browser_cookie_auth: true
    validation: Exact match against the request origin (scheme and Host), with an explicit local development UI origin allowed for development.
  failure:
    code: permission.denied
    disclosure: Missing, invalid, expired, origin-mismatched, and forbidden-transport credentials are indistinguishable.

envelope:
  description: Shared envelope for all management WebSocket channels.
  required:
    - channel
    - type
    - timestamp
    - data
  optional:
    - request_id
    - error
  properties:
    channel:
      type: string
      enum: [logs, events, plugin_console]
    type:
      type: string
    timestamp:
      type: string
      format: date-time
    data:
      type: object
    request_id:
      type: string
    error:
      type: object
      required: [code]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object

channels:
  - path: /ws/logs
    channel: logs
    auth: cookie_or_authorization_header
    replay_policy: summary_only
    events:
      - event: logs.appended
        channel: logs
        description: Push a structured log line summary to the management surface. Deep history browsing stays on /api/logs cursor loading; this channel only replays the recent window for the current server boot session and real-time appends.
        payload_schema:
          type: object
          additionalProperties: false
          required: [log_id, timestamp, level, source, message]
          properties:
            log_id:
              type: string
              minLength: 1
            timestamp:
              type: string
              format: date-time
              description: Log creation instant in UTC RFC3339 with a Z suffix and nine fractional second digits, matching the HTTP log summary. Readers accept historical RFC3339 offsets and variable fractional precision.
            level:
              type: string
              enum: [debug, info, warn, error]
            source:
              type: string
            message:
              type: string
              description: OneBot11 bridge inbound message summaries may include bot, conversation, sender, and message preview context.
            protocol:
              type: string
              enum: [onebot11, qqofficial]
            plugin_id:
              type: string
            request_id:
              type: string
              description: Correlates the logs written while handling one request. Logs written outside any request carry the reserved value `system`, which correlates nothing.
        required: [log_id, timestamp, level, source, message]
        example_ref: fixtures/websocket/ok.logs-appended.protocol-onebot11.json

  - path: /ws/events
    channel: events
    auth: cookie_or_authorization_header
    replay_policy: state_changes_only
    events:
      - event: events.received
        channel: events
        description: >
          Push a management-facing summary event. This event is not a raw chat
          event broadcast and must not be used as a general replay stream for
          protocol events.
        payload_schema:
          description: The payload must satisfy exactly one of the branches below.
          oneOf:
            - type: object
              additionalProperties: false
              required: [service_status, summary]
              description: >
                新订阅收到当前服务快照；后续在 service_status、stop_intent、summary、reason、reason_codes 或 readiness checks 的内容与上次广播不同时推送。
                checks 不包含在载荷中，因此检查变化时可能推送相同载荷；时间戳不参与比较。
                通过 Launcher、管理 API 或操作系统信号开始优雅关闭时，服务立即发布 service_status 为 stopping 的快照。
                stop_intent 仅在 stopping 时携带，值为 stop、restart 或 update；首个优雅关闭请求确定该值，后续请求不覆盖。
                /api/system/shutdown 和操作系统信号固定为 stop，Launcher 请求省略 intent 时也为 stop。
                summary 面向读者，分别为“服务正在停止”、“服务正在重启”或“服务正在安装更新”。客户端按 stop_intent 分支，不解析 summary 或 reason。
                服务关闭事件连接前，为已有订阅者写出该快照提供共享的最多 1 秒等待窗口；全部写出或断开后立即继续关闭，不逐连接累加等待时间。
                连接不可写、等待超时或进程被强制终止时不保证送达；客户端收到 stopping 后应将随后的断线视为预期停止，不等待 stopped 帧。
                restart 或 update 表示预期的临时断线，客户端继续重连；stop 或缺少 stop_intent 时按停止处理。
              if:
                required: [stop_intent]
              then:
                properties:
                  service_status:
                    const: stopping
              properties:
                service_status:
                  type: string
                  enum: [setup_required, stopped, starting, running, degraded, stopping, failed]
                stop_intent:
                  type: string
                  enum: [stop, restart, update]
                summary:
                  type: string
                reason:
                  type: string
                reason_codes:
                  type: array
                  items:
                    type: string
            - type: object
              additionalProperties: false
              required: [plugin_id, state, commands, command_conflicts]
              properties:
                plugin_id:
                  type: string
                state:
                  $ref: ./web-api.openapi.yaml#/components/schemas/PluginState
                state_diagnosis:
                  $ref: ./web-api.openapi.yaml#/components/schemas/PluginStateDiagnosis
                commands:
                  type: array
                  items:
                    $ref: ./web-api.openapi.yaml#/components/schemas/PluginCommandSummary
                command_conflicts:
                  type: array
                  items:
                    type: string
            - type: object
              additionalProperties: false
              required: [connection_status, summary]
              properties:
                connection_status:
                  type: string
                  enum: [disconnected, connecting, connected, authenticated, auth_failed, reconnecting]
                summary:
                  type: string
            - type: object
              additionalProperties: false
              required: [event_type, summary]
              properties:
                event_type:
                  type: string
                  description: Generic management event type. Unrecognized types remain displayable without triggering domain refresh.
                  examples: [governance.changed]
                summary:
                  type: string
            - type: object
              additionalProperties: false
              description: |
                已配置适配器实例的状态快照。任一实例的连接状态变化时推送，
                与 GET /api/adapters 的 adapters 字段同形，管理面据此更新
                适配器列表与该实例传输明细。按配置顺序排列，无实例时为 []。
              required: [adapters]
              properties:
                adapters:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, protocol, display_name, enabled, state, summary]
                    properties:
                      id:
                        type: string
                        description: 适配器实例标识，与配置 adapters[].id 一致。
                      protocol:
                        type: string
                        enum: [onebot11, qqofficial]
                      display_name:
                        type: string
                      enabled:
                        type: boolean
                      state:
                        type: string
                        enum: [idle, listening, connecting, connected, auth_failed, reconnecting, stopped]
                      summary:
                        type: string
                      identity:
                        type: object
                        additionalProperties: false
                        description: 已确认的机器人账号资料，与 HTTP AdapterIdentity 一致；未知身份时省略。
                        required: [id, name]
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                            description: 平台返回的用户名；暂未获取时为空字符串。
                          avatar_url:
                            type: string
                            format: uri
                            pattern: '^https://'
                            maxLength: 2048
                            description: 机器人头像的 HTTPS 地址；未知或不可用时省略，客户端加载失败时显示默认头像。
                      onebot11:
                        type: object
                        additionalProperties: false
                        required:
                          [protocol, provider, configured_transports, active_transports, transport_status, readiness_status, summary, recent_transport_issues]
                        properties:
                          protocol:
                            type: string
                            enum: [onebot11]
                          provider:
                            type: string
                            enum: [unknown, standard, napcat, luckylillia]
                          configured_transports:
                            type: array
                            items:
                              type: string
                              enum: [reverse_ws, forward_ws, http_api, webhook]
                          active_transports:
                            type: array
                            items:
                              type: string
                              enum: [reverse_ws, forward_ws, http_api, webhook]
                          transport_status:
                            type: array
                            items:
                              type: object
                              additionalProperties: false
                              required: [transport, enabled, configured, endpoint, state, summary]
                              properties:
                                transport:
                                  type: string
                                  enum: [reverse_ws, forward_ws, http_api, webhook]
                                enabled:
                                  type: boolean
                                configured:
                                  type: boolean
                                endpoint:
                                  type: string
                                state:
                                  type: string
                                  enum: [idle, listening, connecting, connected, auth_failed, reconnecting, stopped]
                                summary:
                                  type: string
                                provider:
                                  type: string
                                  enum: [unknown, standard, napcat, luckylillia]
                                app_name:
                                  type: string
                                protocol_version:
                                  type: string
                                app_version:
                                  type: string
                                user_id:
                                  type: string
                                nickname:
                                  type: string
                          readiness_status:
                            type: string
                            enum: [ready, degraded, failed, setup_required]
                          summary:
                            type: string
                          recent_transport_issues:
                            type: array
                            items:
                              type: object
                              additionalProperties: false
                              required: [code, severity, summary]
                              properties:
                                code:
                                  type: string
                                severity:
                                  type: string
                                  enum: [info, warning, error]
                                summary:
                                  type: string
            - type: object
              additionalProperties: false
              description: >
                消息统计有变化时推送：连接收到或发出被计入的消息，或连接中断开始、结束。
                同一服务最多每 2 秒推送一次，变化后 2 秒内送出，没有变化时不推送；载荷不携带计数，
                客户端据此重新读取 GET /api/system/message-stats。慢连接上的推送可能被较新的事件替换，
                客户端仍按低频轮询兜底。
              required: [message_stats]
              properties:
                message_stats:
                  type: object
                  additionalProperties: false
                  required: [changed_at, adapter_ids]
                  properties:
                    changed_at:
                      type: string
                      format: date-time
                      description: 服务端合并本批变化的时间（UTC）。
                    adapter_ids:
                      type: array
                      uniqueItems: true
                      description: 计数或中断状态有变化的连接，按 adapter_id 升序。
                      items:
                        type: string
                        minLength: 1
            - type: object
              additionalProperties: false
              required: [observability_scope, summary, delivered_count, result_count, error_count]
              properties:
                observability_scope:
                  type: string
                  enum: [bridge_runtime]
                summary:
                  type: string
                  description: >
                    Aggregate-only bridge/runtime observability summary. This
                    summary must not include raw message content, protocol
                    payload fragments, request identifiers, sender identifiers,
                    or conversation identifiers.
                last_supported_event_kind:
                  type: string
                last_delivery_outcome:
                  type: string
                  enum: [delivered, error]
                delivered_count:
                  type: integer
                  minimum: 0
                result_count:
                  type: integer
                  minimum: 0
                error_count:
                  type: integer
                  minimum: 0
                adapter_dedup_drops_total:
                  type: integer
                  minimum: 0
                  description: >
                    Aggregate count of inbound events the adapter dropped as
                    duplicates of a recently observed event id. Counts within
                    the adapter dedup retention window.
                bridge_ignored_total:
                  type: integer
                  minimum: 0
                  description: >
                    Aggregate count of events the bridge accepted but found no
                    interested plugin runtime to deliver to.
                dispatcher_delivered_total:
                  type: integer
                  minimum: 0
                  description: >
                    Cross-layer view of dispatcher delivered outcomes counted
                    against the bridge runtime window. Same source as the
                    dispatcher_runtime observability scope.
                dispatcher_dropped_total:
                  type: integer
                  minimum: 0
                  description: >
                    Cross-layer view of dispatcher dropped outcomes (queue full,
                    plugin not running, etc.) counted against the bridge runtime
                    window.
                dispatcher_ignored_total:
                  type: integer
                  minimum: 0
                  description: >
                    Cross-layer view of dispatcher ignored outcomes counted
                    against the bridge runtime window.
            - type: object
              additionalProperties: false
              required: [observability_scope, window_seconds, delivered_count, dropped_count, ignored_count]
              properties:
                observability_scope:
                  type: string
                  enum: [dispatcher_runtime]
                window_seconds:
                  type: integer
                  minimum: 1
                  description: >
                    Length of the rolling window covered by this aggregate
                    snapshot. The dispatcher flushes summary snapshots at the
                    end of each window.
                delivered_count:
                  type: integer
                  minimum: 0
                dropped_count:
                  type: integer
                  minimum: 0
                ignored_count:
                  type: integer
                  minimum: 0
                drops_by_reason:
                  type: array
                  description: >
                    Per-reason aggregation of dispatcher drops within the window.
                    plugin_id and event_type may be omitted when the drop reason
                    is not bound to a specific plugin or event type.
                  items:
                    type: object
                    additionalProperties: false
                    required: [reason, count]
                    properties:
                      reason:
                        type: string
                        enum:
                          - queue_full
                          - plugin_not_running
                          - unsubscribed
                          - runtime_unavailable
                      plugin_id:
                        type: string
                      event_type:
                        type: string
                      count:
                        type: integer
                        minimum: 0
        example_ref: fixtures/websocket/ok.events-received-protocol-snapshot.json

  - path: /ws/plugins/{id}/console
    channel: plugin_console
    auth: cookie_or_authorization_header
    replay_policy: ring_buffer
    events:
      - event: plugins.console
        channel: plugin_console
        description: Push a single plugin console frame after platform-side redaction and rate limiting.
        payload_schema:
          type: object
          additionalProperties: false
          required: [plugin_id, stream, text, timestamp]
          properties:
            plugin_id:
              type: string
            stream:
              type: string
              enum: [stdout, stderr, system]
            text:
              type: string
            timestamp:
              type: string
              format: date-time
              description: UTC collection instant with a Z suffix and nine fractional second digits. Any source timestamp embedded in text remains unchanged.
        required: [plugin_id, stream, text, timestamp]
        example_ref: fixtures/websocket/ok.plugins-console-stderr.json

session_events:
  - event: session_expired
    description: >
      Sent when the current management session expires or is invalidated. The
      client must reconnect with a fresh cookie or Authorization session. This event is channel
      agnostic and does not authorize continued use of an expired connection.
    payload_schema:
      type: object
      additionalProperties: false
    required: []
    example_ref: fixtures/websocket/edge.session-expired.json

version: 1
description: >
  Fixture-ready WebSocket contract. This file freezes the shared envelope,
  channel admission and replay policy, and the smallest set of server-push
  event types needed by the management surface. Event payload schemas live in
  web-api.openapi.yaml components and are referenced here.
x-fixtures:
  - fixtures/websocket/edge.events-received-plugin-initialization-failed.json
  - fixtures/websocket/ok.logs-appended.json
  - fixtures/websocket/ok.logs-appended.outbound-onebot11.json
  - fixtures/websocket/ok.logs-appended.task.json
  - fixtures/websocket/ok.logs-appended.protocol-onebot11.json
  - fixtures/websocket/ok.logs-appended.protocol-qqofficial.json
  - fixtures/websocket/ok.plugins-console-stderr.json
  - fixtures/websocket/ok.events-received-bridge-runtime-observability.json
  - fixtures/websocket/ok.events-received-dispatcher-runtime-observability.json
  - fixtures/websocket/ok.events-received-protocol-snapshot.json
  - fixtures/websocket/ok.events-received-adapters-snapshot.json
  - fixtures/websocket/ok.events-received-service-running.json
  - fixtures/websocket/ok.events-received-service-stopping.json
  - fixtures/websocket/ok.events-received-service-restarting.json
  - fixtures/websocket/invalid.events-received-running-stop-intent.json
  - fixtures/websocket/ok.events-received-governance-changed.json
  - fixtures/websocket/ok.events-received-message-stats-changed.json
  - fixtures/websocket/invalid.events-received-message-stats-counts.json
  - fixtures/websocket/edge.events-received-degraded.json
  - fixtures/websocket/edge.events-received-bridge-runtime-zeroed.json
  - fixtures/websocket/edge.events-received-plugin-crashed.json
  - fixtures/websocket/edge.session-expired.json
  - fixtures/websocket/invalid.events-received-plugin-invalid-state.json
  - fixtures/websocket/invalid.events-received-raw-chat.json
  - fixtures/websocket/invalid.events-received-bridge-runtime-raw-leak.json

admission:
  authentication:
    accepted: [cookie, authorization_header]
    cookie_name: raylea_session
    authorization_scheme: Bearer
    forbidden: [query_token, query_session_token]
  origin:
    required_for_browser_cookie_auth: true
    validation: Exact match against the request origin (scheme and Host), with an explicit local development UI origin allowed for development.
  failure:
    code: permission.denied
    disclosure: Missing, invalid, expired, origin-mismatched, and forbidden-transport credentials are indistinguishable.

envelope:
  description: Shared envelope for all management WebSocket channels.
  required:
    - channel
    - type
    - timestamp
    - data
  optional:
    - request_id
    - error
  properties:
    channel:
      type: string
      enum: [logs, events, plugin_console]
    type:
      type: string
    timestamp:
      type: string
      format: date-time
    data:
      type: object
    request_id:
      type: string
    error:
      type: object
      required: [code]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object

channels:
  - path: /ws/logs
    channel: logs
    auth: cookie_or_authorization_header
    replay_policy: summary_only
    events:
      - event: logs.appended
        channel: logs
        description: Push a structured log line summary to the management surface. Deep history browsing stays on /api/logs cursor loading; this channel only replays the recent window for the current server boot session and real-time appends.
        payload_schema:
          $ref: ./web-api.openapi.yaml#/components/schemas/LogSummary
        example_ref: fixtures/websocket/ok.logs-appended.protocol-onebot11.json

  - path: /ws/events
    channel: events
    auth: cookie_or_authorization_header
    replay_policy: state_changes_only
    events:
      - event: events.received
        channel: events
        description: >
          Push a management-facing summary event. This event is not a raw chat
          event broadcast and must not be used as a general replay stream for
          protocol events.
        payload_schema:
          $ref: ./web-api.openapi.yaml#/components/schemas/EventsReceivedPayload
        example_ref: fixtures/websocket/ok.events-received-protocol-snapshot.json

  - path: /ws/plugins/{id}/console
    channel: plugin_console
    auth: cookie_or_authorization_header
    replay_policy: ring_buffer
    events:
      - event: plugins.console
        channel: plugin_console
        description: Push a single plugin console frame after platform-side redaction and rate limiting.
        payload_schema:
          $ref: ./web-api.openapi.yaml#/components/schemas/PluginConsoleFrame
        example_ref: fixtures/websocket/ok.plugins-console-stderr.json

session_events:
  - event: session_expired
    description: >
      Sent when the current management session expires or is invalidated. The
      client must reconnect with a fresh cookie or Authorization session. This event is channel
      agnostic and does not authorize continued use of an expired connection.
    payload_schema:
      $ref: ./web-api.openapi.yaml#/components/schemas/SessionExpiredPayload
    example_ref: fixtures/websocket/edge.session-expired.json

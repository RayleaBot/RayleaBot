    UpdateState:
      type: string
      enum: [disabled, idle, checking, up_to_date, update_available, downloading, ready_to_install, installing, succeeded, failed, rolled_back, rollback_failed]

    UpdatePhase:
      type: string
      enum: [metadata, artifact, backup, extract, preflight, stop, swap, postflight, commit, rollback]

    UpdateStatusResponse:
      type: object
      additionalProperties: false
      required: [state, current_version, checked_at, update_mode, automatic_install_supported]
      properties:
        state:
          $ref: '#/components/schemas/UpdateState'
        phase:
          $ref: '#/components/schemas/UpdatePhase'
        current_version:
          type: string
        available_version:
          type: string
        checked_at:
          type: [string, 'null']
          format: date-time
        update_mode:
          type: string
          enum: [automatic, guided, manual, unavailable]
        automatic_install_supported:
          type: boolean
        release_notes_ref:
          type: string
          format: uri
        error:
          $ref: '#/components/schemas/ErrorEnvelope'

    WebhookAcceptedResponse:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted:
          type: boolean

      parameters:
        - $ref: '#/components/parameters/CollectionLimit'
        - $ref: '#/components/parameters/CollectionCursor'
        - $ref: '#/components/parameters/CollectionQuery'
        - name: status
          in: query
          schema: {type: string, enum: [success, error]}
          description: success selects absent last_error, including jobs that have never run; error selects a present last_error.
        - name: sort
          in: query
          schema: {type: string, enum: [name, last_run, duration], default: name}
          description: name orders by plugin display name then task_name; other modes descend by last_run (missing last) or duration. Ties use plugin_id then job_id.
      responses:
        '200':
          description: Scheduler job summaries.
          content:
            application/json:

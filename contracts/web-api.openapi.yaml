          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

    delete:
      summary: Cancel a third-party QR code login session.
      operationId: cancelThirdPartyQRCodeLogin
      security:
        - BearerAuth: []
        - CookieAuth: []
          CSRFAuth: []
      parameters:
        - $ref: '#/components/parameters/ThirdPartyPlatform'
        - $ref: '#/components/parameters/ThirdPartyQRCodeLoginId'
      responses:
        '204':
          description: QR code login session cancelled and its provider resources released.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  /api/third-party/accounts/{platform}/{account_id}/validate:
    post:
      summary: Validate one saved third-party account credential.
      operationId: validateThirdPartyAccount
      security:
        - BearerAuth: []
        - CookieAuth: []
          CSRFAuth: []
      parameters:
        - $ref: '#/components/parameters/ThirdPartyPlatform'
        - $ref: '#/components/parameters/ThirdPartyAccountId'
      responses:
        '200':
          description: Credential check completed. Valid, invalid, and unknown are all successful check outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThirdPartyAccountValidationResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  /api/third-party/accounts/{platform}/{account_id}/avatar:
    get:
      summary: Fetch the saved profile avatar for one third-party account through a controlled platform media request.
      operationId: getThirdPartyAccountAvatar
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ThirdPartyPlatform'
        - $ref: '#/components/parameters/ThirdPartyAccountId'
      responses:
        '200':
          description: Saved account avatar bytes.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/avif:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  /api/update/status:
    get:
      summary: Query the shared release trust and update state without starting installation.
      operationId: getUpdateStatus
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Current update state and latest trusted release observation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatusResponse'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  /api/update/check:
    post:
      summary: Check the compiled release repository for a trusted v2 manifest; never download or install an artifact.
      operationId: checkForUpdate
      security:
        - BearerAuth: []
        - CookieAuth: []
          CSRFAuth: []
      responses:
        '200':
          description: Completed trusted update check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatusResponse'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  /api/webhooks/{plugin_id}/{route}:
    post:
      summary: Receive a controlled plugin webhook and enqueue a webhook.received event for the target plugin.
      operationId: postPluginWebhook
      parameters:
        - $ref: '#/components/parameters/PluginId'
        - name: route
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9](?:[a-z0-9_-]{0,31})$'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          text/plain:
            schema:
              type: string
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '202':
          description: Webhook request accepted for controlled dispatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAcceptedResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        Session token issued by /api/session/login or /api/setup/admin,
        passed as a Bearer token in the Authorization header.
    CookieAuth:
      type: apiKey
      in: cookie
      name: raylea_session
      description: Host-only HttpOnly SameSite=Strict browser session cookie. Secure is required when web.public_origin is HTTPS.
    CSRFAuth:
      type: apiKey
      in: header
      name: X-Raylea-CSRF
      description: Required on every state-changing request authenticated by CookieAuth. Invalid or missing values map to permission.denied.
    SetupTokenAuth:
      type: apiKey
      in: header
      name: X-Raylea-Setup-Token
      description: One-time 256-bit setup token. Invalid, missing, or reused values map to permission.denied.
    LauncherControlAuth:
      type: apiKey
      in: header
      name: X-Raylea-Launcher-Control
      description: Per-process launcher control token. Invalid or missing values map to permission.denied.

  headers:
    SessionTransport:
      description: Session transport selected for this response.
      schema:
        type: string
        enum: [cookie, bearer]
    CSRFToken:
      description: Session-bound CSRF value returned to an authenticated same-origin browser and kept in memory only.
      schema:
        type: string
        minLength: 32

  parameters:
    CollectionLimit:
      name: limit
      in: query
      description: Maximum entries in this response. Changing a query starts at cursor 0.
      schema: {type: integer, minimum: 1, maximum: 100, default: 100}
    CollectionCursor:
      name: cursor
      in: query
      description: Decimal offset in the stable endpoint order; reset after a collection change. Not an immutable database snapshot.
      schema: {type: integer, minimum: 0, maximum: 2147483647}
    CollectionQuery:
      name: query
      in: query
      description: Substring search over the endpoint's identifying labels, IDs and descriptions, ignoring ASCII letter case; filtering occurs before pagination.
      schema: {type: string, maxLength: 200}
    AdapterID:
      name: adapterID
      in: path
      required: true
      description: 适配器实例标识，与配置 adapters[].id 一致。
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[a-z0-9][a-z0-9-]*$'
    SessionTransport:
      name: X-Raylea-Session-Transport
      in: header
      required: false
      description: Select cookie for the browser session flow or bearer for API clients. Defaults to bearer.
      schema:
        type: string
        enum: [cookie, bearer]
        default: bearer
    LogId:
      name: log_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    PluginId:
      name: plugin_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: '^[a-z0-9](?:[a-z0-9._-]{0,62}[a-z0-9])?$'
    PluginStoreSourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9](?:[a-z0-9_-]{0,62}[a-z0-9])?$'
    GovernanceEntryType:
      name: entry_type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/GovernanceEntryType'
    GovernanceTargetId:
      name: target_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TemplateId:
      name: template_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SchedulerJobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ThirdPartyPlatform:
      name: platform
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ThirdPartyPlatform'
    ThirdPartyAccountId:
      name: account_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9](?:[a-z0-9_.-]{0,62}[a-z0-9])?$'
    ThirdPartyQRCodeLoginId:
      name: login_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9](?:[a-z0-9_.-]{0,126}[a-z0-9])?$'

  responses:
    Error:
      description: Standard structured error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    CollectionPage:
      type: object
      required: [total]
      properties:
        total: {type: integer, minimum: 0, description: Number of entries matching this query.}
        next_cursor:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: Next decimal offset; omitted when no more entries match.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, message_key, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            message_key:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true

    SessionLoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, secret]
      properties:
        identifier:
          type: string
          minLength: 1
        secret:
          type: string
          minLength: 1

    AccountCredentialsUpdateRequest:
      type: object
      additionalProperties: false
      required: [current_secret, new_secret]
      properties:
        current_secret:
          type: string
          minLength: 1
          writeOnly: true
        new_secret:
          type: string
          minLength: 8
          maxLength: 1024
          writeOnly: true
          description: New password, measured in Unicode code points and preserved verbatim.
        new_identifier:
          type: string
          maxLength: 128
          description: Optional new administrator username; blank or omitted keeps the existing username.

    SessionLoginResponse:
      type: object
      additionalProperties: false
      required: [transport]
      oneOf:
        - required: [session_token]
          properties:
            transport:
              const: bearer
        - required: [csrf_token]
          properties:
            transport:
              const: cookie
      properties:
        transport:
          type: string
          enum: [cookie, bearer]
        session_token:
          type: string
          minLength: 1
          description: Opaque management session token returned only for bearer transport.
        csrf_token:
          type: string
          minLength: 32
          description: Session-bound CSRF value returned only for cookie transport and kept in browser memory.
        expires_at:
          type: string
          format: date-time

    SetupStatusResponse:
      type: object
      additionalProperties: false
      required: [initialized]
      properties:
        initialized:
          type: boolean
          description: Whether the initial management credential source has been bootstrapped.

    ConfigDocument:
      $ref: './config.user.schema.json'

    ConfigSnapshotResponse:
      type: object
      additionalProperties: false
      required: [config, effective_timezone, revision]
      properties:
        revision:
          type: integer
          minimum: 1
          description: Process-local revision of the saved desired configuration. Starts at 1 and advances after each successful persistence; invalid, cancelled, or failed writes do not advance it. Read together with config under the same update lock.
        effective_timezone:
          type: string
          minLength: 1
          description: IANA timezone currently used by the running scheduler and management time display. Remains unchanged after saving a timezone change until the server restarts. Defaults to Asia/Shanghai.
        config:
          $ref: '#/components/schemas/ConfigDocument'
        redacted_fields:
          type: array
          items:
            type: string

    ConfigApplyEffects:
      type: object
      additionalProperties: false
      required: [applied_now, reloaded_now, restart_required_fields]
      properties:
        failed_groups:
          type: array
          uniqueItems: true
          description: Saved settings whose runtime application failed. Corresponding fields require restart; group actions run in documented order and do not form a cross-service transaction. Omitted when all requested groups applied.
          items:
            type: string
            enum: [adapters, logging]
        applied_now:
          type: array
          items:
            type: string
        reloaded_now:
          type: array
          items:
            type: string
        restart_required_fields:
          type: array
          items:
            type: string

    ConfigUpdateResponse:
      type: object
      additionalProperties: false
      required: [config, effective_timezone, revision, restart_required, apply_effects]
      properties:
        revision:
          type: integer
          minimum: 1
          description: Process-local revision of the saved desired configuration. Starts at 1 and advances after each successful persistence; invalid, cancelled, or failed writes do not advance it. Read together with config under the same update lock.
        effective_timezone:
          type: string
          minLength: 1
          description: IANA timezone currently used by the running scheduler and management time display, including while config.scheduler.timezone awaits restart.
        config:
          $ref: '#/components/schemas/ConfigDocument'
        redacted_fields:
          type: array
          items:
            type: string
        restart_required:
          type: boolean
          description: Whether a server restart is required before the new config takes effect.
        apply_effects:
          $ref: '#/components/schemas/ConfigApplyEffects'

    SystemStatusResponse:
      type: object
      additionalProperties: false
      required: [status, adapters]
      properties:
        status:
          type: string
          enum: [running, shutting_down]
        adapters:
          type: array
          description: 按配置顺序返回实例状态；无实例时为 []，不构造占位连接。
          items:
            $ref: '#/components/schemas/AdapterStatus'
        active_plugins:
          type: integer
          minimum: 0
          description: Number of plugin runtimes currently active.
        running_plugins:
          type: integer
          minimum: 0
          description: Number of plugins currently in the running state.
        failed_plugins:
          type: integer
          minimum: 0
          description: Number of plugins currently in the failed state.
        db_schema_version:
          type: string
          description: Current database schema migration version.
        uptime_seconds:
          type: integer
          minimum: 0
        recovery_summary:
          $ref: '#/components/schemas/RecoveryCompatibilitySummary'
        health:
          $ref: '#/components/schemas/ReadinessStatusResponse'

    SystemDiagnosticsResponse:
      type: object
      additionalProperties: false
      required: [generated_at, build, system, config, secrets, database, adapters, plugins, render, third_party, scheduler, tasks, dependencies, filesystem, recent_errors, issues]
      properties:
        generated_at:
          type: string
          format: date-time
        build:
          $ref: '#/components/schemas/SystemDiagnosticsBuild'
        system:
          $ref: '#/components/schemas/SystemDiagnosticsSystem'
        config:
          $ref: '#/components/schemas/SystemDiagnosticsConfig'
        secrets:
          $ref: '#/components/schemas/SystemDiagnosticsSecrets'
        database:
          $ref: '#/components/schemas/SystemDiagnosticsDatabase'
        adapters:
          type: array
          items:
            $ref: '#/components/schemas/AdapterStatus'
        plugins:
          $ref: '#/components/schemas/SystemDiagnosticsPlugins'
        render:
          $ref: '#/components/schemas/SystemDiagnosticsIssueGroup'
        third_party:
          $ref: '#/components/schemas/SystemDiagnosticsThirdParty'
        scheduler:
          $ref: '#/components/schemas/SystemDiagnosticsScheduler'
        tasks:
          $ref: '#/components/schemas/SystemDiagnosticsTaskSummary'
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/SystemDiagnosticsDependency'
        filesystem:
          type: array
          items:
            $ref: '#/components/schemas/SystemDiagnosticsPathPermission'
        recent_errors:
          type: array
          items:
            $ref: '#/components/schemas/LogSummary'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticIssue'
        recovery_summary:
          $ref: '#/components/schemas/RecoveryCompatibilitySummary'

    SystemDiagnosticsBuild:
      type: object
      additionalProperties: false
      required: [core_version]
      properties:
        core_version:
          type: string

    SystemDiagnosticsSystem:
      type: object
      additionalProperties: false
      required: [status, uptime_seconds]
      properties:
        status:
          type: string
          enum: [running, shutting_down]
        uptime_seconds:
          type: integer
          minimum: 0

    SystemDiagnosticsConfig:
      type: object
      additionalProperties: false
      required: [schema_version, status, apply_state, config_path, schema_path, database_engine, database_path, adapter_count]
      properties:
        schema_version:
          type: string
        status:
          type: string
          enum: [loaded]
        apply_state:
          type: string
          enum: [applied]
        config_path:
          type: string
        schema_path:
          type: string
        database_engine:
          type: string
        database_path:
          type: string
        adapter_count:
          type: integer
          minimum: 0

    SystemDiagnosticsSecrets:
      type: object
      additionalProperties: false
      required: [unresolved_refs]
      properties:
        unresolved_refs:
          type: array
          items:
            type: string

    SystemDiagnosticsDatabase:
      type: object
      additionalProperties: false
      required: [schema_version, initialized_at]
      properties:
        schema_version:
          type: string
        initialized_at:
          type: string
          description: Timestamp of this database's atomic initialization, or empty when its metadata is unavailable.

    AdapterStatus:
      type: object
      additionalProperties: false
      required: [id, protocol, enabled, state]
      properties:
        id:
          type: string
          minLength: 1
        protocol:
          $ref: '#/components/schemas/AdapterProtocol'
        enabled:
          type: boolean
        state:
          $ref: '#/components/schemas/AdapterState'

    SystemDiagnosticsPlugins:
      type: object
      additionalProperties: false
      required: [total, active, running, failed]
      properties:
        total:
          type: integer
          minimum: 0
        active:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0

    SystemDiagnosticsIssueGroup:
      type: object
      additionalProperties: false
      required: [status, issues]
      properties:
        status:
          type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticIssue'

    SystemDiagnosticsThirdParty:
      type: object
      additionalProperties: false
      required: [total, enabled, configured, invalid, platforms]
      properties:
        total:
          type: integer
          minimum: 0
        enabled:
          type: integer
          minimum: 0
        configured:
          type: integer
          minimum: 0
        invalid:
          type: integer
          minimum: 0
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/SystemDiagnosticsThirdPartyPlatform'

    SystemDiagnosticsThirdPartyPlatform:
      type: object
      additionalProperties: false
      required: [platform, total, enabled, configured, invalid]
      properties:
        platform:
          $ref: '#/components/schemas/ThirdPartyPlatform'
        total:
          type: integer
          minimum: 0
        enabled:
          type: integer
          minimum: 0
        configured:
          type: integer
          minimum: 0
        invalid:
          type: integer
          minimum: 0

    SystemDiagnosticsScheduler:
      type: object
      additionalProperties: false
      required: [total, enabled, disabled, pending, running, failed]
      properties:
        total:
          type: integer
          minimum: 0
        enabled:
          type: integer
          minimum: 0
        disabled:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0

    SystemDiagnosticsTaskSummary:
      type: object
      additionalProperties: false
      required: [pending, running, failed]
      properties:
        pending:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0

    SystemDiagnosticsDependency:
      type: object
      additionalProperties: false
      required: [kind, status, metadata_complete, cached_archive_present, prepared_store_present, system_browser]
      properties:
        kind:
          type: string
          enum: [chromium, ffmpeg]
        status:
          type: string
          enum: [ready, cached, on_demand, metadata_incomplete, unavailable]
        metadata_complete:
          type: boolean
        cached_archive_present:
          type: boolean
        prepared_store_present:
          type: boolean
        system_browser:
          type: boolean

    SystemDiagnosticsPathPermission:
      type: object
      additionalProperties: false
      required: [label, path, status, is_dir]
      properties:
        label:
          type: string
        path:
          type: string
        status:
          type: string
          enum: [ok, missing, unreadable, unknown]
        is_dir:
          type: boolean

    AdapterProtocol:
      type: string
      description: >
        正式支持的聊天适配器标识。集合随正式接入的适配器增长；管理面按此值区分协议，
        不从会话种类或标识符格式推断来源。
      enum:
        - onebot11
        - qqofficial
    AdapterState:
      type: string
      description: 适配器连接状态，与聊天传输状态共用词表。
      enum:
        - idle
        - listening
        - connecting
        - connected
        - auth_failed
        - reconnecting
        - stopped
    AdapterIdentity:
      type: object
      additionalProperties: false
      description: 已确认的机器人账号资料；未知身份时省略整个 identity，不使用配置实例标识或 AppID 代替。
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: 适配器登录后由平台确认的机器人标识，属于该协议的身份命名空间。
        name:
          type: string
          description: 平台返回的用户名；暂未获取时为空字符串。
        avatar_url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
          description: 机器人头像的 HTTPS 地址；OneBot11 使用已确认 QQ 号的头像地址，QQ 官方机器人使用平台账号资料。未知或不可用时省略，客户端加载失败时显示默认头像。
    AdapterDescriptor:
      type: object
      additionalProperties: false
      required:
        - id
        - protocol
        - display_name
        - enabled
        - state
        - summary
      properties:
        id:
          type: string
          description: |
            适配器实例标识，与配置 adapters[].id 一致。它决定出站路由、密钥存储键
            和入站地址 /api/adapters/{id}/reverse-ws。
        protocol:
          $ref: '#/components/schemas/AdapterProtocol'
        display_name:
          type: string
          description: 管理面展示名。同一协议存在多个实例时包含实例标识以便区分。
        enabled:
          type: boolean
        state:
          $ref: '#/components/schemas/AdapterState'
        summary:
          type: string
        identity:
          $ref: '#/components/schemas/AdapterIdentity'
        onebot11:
          description: 此实例的 OneBot11 传输摘要；其他协议或尚未创建运行实例时省略。
          $ref: '#/components/schemas/OneBot11ProtocolSnapshotResponse'

    AdapterProtocolDescriptor:
      type: object
      additionalProperties: false
      description: 可添加实例的聊天协议。
      required:
        - protocol
        - display_name
        - description
      properties:
        protocol:
          $ref: '#/components/schemas/AdapterProtocol'
        display_name:
          type: string
        description:
          type: string
    AdaptersResponse:
      type: object
      additionalProperties: false
      required:
        - adapters
        - available_protocols
      properties:
        adapters:
          type: array
          description: 已配置的适配器实例，按配置顺序返回；无实例时为 []。
          items:
            $ref: '#/components/schemas/AdapterDescriptor'
        available_protocols:
          type: array
          description: 可添加实例的协议。集合与已配置实例无关，添加同一协议的多个实例是允许的。

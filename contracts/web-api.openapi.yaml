x-browser-session-policy:
  cookie: raylea_session; Host-only; HttpOnly; SameSite=Strict
  secure: Required when web.public_origin uses HTTPS
  csrf_header: X-Raylea-CSRF
  rule: Every POST, PUT, PATCH, or DELETE admitted through CookieAuth must also satisfy CSRFAuth; BearerAuth clients do not send the CSRF header.
  websocket: Browser WebSocket admission uses CookieAuth and exact Origin validation; query-string session tokens are forbidden.

paths:
  /api/development/status:
    get:
      operationId: getDevelopmentStatus
      summary: Identify the authenticated local development runtime.
      description: >
        Available only when RAYLEA_DEV_ARTIFACT_ROOT is explicitly configured at process startup.
        Requires direct loopback, no forwarding headers or Origin, and LauncherControlAuth.
        Disabled mode, remote, browser and unauthenticated requests return 403 permission.denied.
        The canonical artifact root identifies the checkout; no token is returned.
      security:
        - LauncherControlAuth: []
      responses:
        '200':
          description: Development runtime identity.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [artifact_root]
                properties:
                  artifact_root: {type: string, minLength: 1}
        '403':
          $ref: '#/components/responses/Error'
  /api/development/plugins/sync:
    post:
      operationId: syncDevelopmentPlugin
      summary: Synchronize one trusted local development artifact without restarting Server.
      description: >
        Uses the same admission as development status. Artifact must resolve strictly below
        the configured artifact root after symlink resolution; source is an absolute repository
        path used only as installation metadata. Neither source discovery nor build commands
        are executed by Server. Invalid paths return 400 platform.invalid_request.
        The normal installer validates the current-platform artifact, atomically replaces only
        that plugin and reconciles its runtime. Existing desired_state is preserved; new plugins
        start enabled. Identical source and actual installed content return changed=false and
        an empty task_id. Changed artifacts return changed=true and a plugin.install task ID;
        poll the development task route until terminal. Enabled development plugins must finish
        runtime initialization before the installation succeeds. Failed replacement restores the previous package.
      security:
        - LauncherControlAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [artifact, source]
              properties:
                artifact: {type: string, minLength: 1, maxLength: 4096}
                source: {type: string, minLength: 1, maxLength: 4096}
      responses:
        '200':
          description: Unchanged package or accepted installation task.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [changed, task_id]
                properties:
                  changed: {type: boolean}
                  task_id: {type: string}
        default:
          $ref: '#/components/responses/Error'
  /api/development/plugins/sync/{task_id}:
    get:
      operationId: getDevelopmentPluginSync
      summary: Query a plugin installation task using local development admission.
      description: >
        Uses the same admission as development status. A missing task or a task of another
        kind returns 404 platform.resource_not_found. pending and running are transient;
        succeeded, failed, cancelled and interrupted are terminal. Unknown statuses are rejected.
        error_code is present only when the task has an error, using the formal error code registry.
      security:
        - LauncherControlAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Installation progress.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [task_id, status]
                properties:
                  task_id: {type: string, minLength: 1}
                  status: {type: string, enum: [pending, running, succeeded, failed, cancelled, interrupted]}
                  error_code: {type: string, minLength: 1}
        default:
          $ref: '#/components/responses/Error'
  /healthz:
    get:
      summary: Probe whether the RayleaBot process is alive.
      operationId: getHealthz
      responses:
        '200':
          description: Process liveness status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessStatusResponse'
        default:
          $ref: '#/components/responses/Error'

  /readyz:
    get:
      summary: Probe whether the management surface is ready for normal use.
      operationId: getReadyz
      responses:
        '200':
          description: Service is ready or degraded-but-manageable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatusResponse'
        '503':
          description: Service is not ready yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatusResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/setup/admin:
    post:
      summary: Bootstrap the initial management credential source and issue a cookie or bearer session.
      operationId: setupAdmin
      security:
        - SetupTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionTransport'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLoginRequest'
      responses:
        '200':
          description: Initial management credential source created and the selected session transport issued.
          headers:
            X-Raylea-Session-Transport:
              $ref: '#/components/headers/SessionTransport'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionLoginResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  /api/setup/status:
    get:
      summary: Query whether the initial management credential source has been bootstrapped.
      operationId: getSetupStatus
      responses:
        '200':
          description: Setup status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatusResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/session/login:
    post:
      summary: Exchange management credentials for a session token.
      description: >
        When the configured max_sessions limit is already reached, the service
        may recycle the oldest active management session before issuing a new one.
      operationId: loginSession
      parameters:
        - $ref: '#/components/parameters/SessionTransport'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLoginRequest'
      responses:
        '200':
          description: The selected session transport was issued; bearer remains the default for API compatibility.
          headers:
            X-Raylea-Session-Transport:
              $ref: '#/components/headers/SessionTransport'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionLoginResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  /api/session:
    delete:
      summary: Invalidate the current session token.
      operationId: logoutSession
      security:
        - BearerAuth: []
        - CookieAuth: []
          CSRFAuth: []
      responses:
        '204':
          description: Session invalidated.
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  /api/account/credentials:
    put:
      operationId: updateAccountCredentials
      summary: Change the authenticated administrator's password and optionally their identifier.
      description: >
        Requires an active management session and verification of current_secret against
        the current administrator password. new_identifier is trimmed; omission or a blank
        value preserves the identifier. The password is never trimmed. The credential update
        and invalidation of all existing sessions, including the caller, are atomic and durable.
        Existing management WebSockets receive session_expired and are closed.
        A successful caller must log in again. Failure preserves credentials and sessions.
        A stale or revoked session returns 401 permission.denied. An incorrect current password
        returns 403 permission.current_secret_invalid without expiring the caller's session.
        Attempts share the configured login failure limit and window by source IP;
        exhausted attempts return 429 platform.rate_limited. Invalid input returns
        400 platform.invalid_request; persistence failures return 500 platform.internal_error.
      security:
        - BearerAuth: []
        - CookieAuth: []
          CSRFAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCredentialsUpdateRequest'
      responses:
        '204':
          description: Credentials saved, all session tokens invalidated, and the browser session cookie cleared.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /api/launcher/status:
    get:
      summary: Query the current system status from a local Launcher process.
      description: >
        This endpoint accepts only direct loopback requests and rejects requests
        containing forwarding headers.
      operationId: getLauncherStatus
      security:
        - LauncherControlAuth: []
      responses:
        '200':
          description: Current system status snapshot for local Launcher display.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusResponse'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  /api/launcher/shutdown:
    post:
      summary: Request graceful server shutdown from a local Launcher process.
      description: >
        This endpoint accepts only direct loopback requests and rejects requests
        containing forwarding headers.
      operationId: shutdownFromLauncher
      security:
        - LauncherControlAuth: []
      responses:
        '202':
          description: Shutdown request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemShutdownResponse'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  /api/config:
    get:
      summary: Query the saved desired management configuration snapshot.
      operationId: getConfig
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Saved desired config snapshot with sensitive fields redacted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigSnapshotResponse'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Validate and persist a new management configuration snapshot.
      operationId: updateConfig
      security:
        - BearerAuth: []
        - CookieAuth: []
          CSRFAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigDocument'
      responses:
        '200':
          description: Config written successfully. restart_required indicates whether a restart is still needed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigUpdateResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  /api/governance/blacklist:
    get:
      summary: Query the current chat-side blacklist snapshot for management review.
      operationId: getGovernanceBlacklist
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CollectionLimit'
        - $ref: '#/components/parameters/CollectionCursor'
        - $ref: '#/components/parameters/CollectionQuery'
        - name: entry_type
          in: query
          schema: {type: string, enum: [user, group]}
      responses:
        '200':
          description: Current user and group blacklist entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceBlacklistResponse'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  /api/governance/blacklist/entries:
    post:
      summary: Upsert one blacklist entry for chat-side governance.
      operationId: upsertGovernanceBlacklistEntry
      security:
        - BearerAuth: []
        - CookieAuth: []
          CSRFAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernanceEntryUpsertRequest'
      responses:
        '200':
          description: Blacklist entry stored successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceEntryUpsertResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  /api/governance/blacklist/entries/{entry_type}/{target_id}:
    delete:
      summary: Delete one blacklist entry for chat-side governance.
      operationId: deleteGovernanceBlacklistEntry
      security:
        - BearerAuth: []
        - CookieAuth: []
          CSRFAuth: []
      parameters:
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [global, instance] }

          schema: {type: string, enum: [running, disabled, alert]}
          description: alert selects failed/invalid state or nonempty command_conflicts.
        - name: source
          in: query
          schema: {type: string, enum: [official, community]}
          description: official selects trust.level official; community selects every other trust level.
      responses:
        '200':
          description: Plugin list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginListResponse'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  /api/plugins/{plugin_id}/icon:
    get:
      summary: Read the declared icon of an installed plugin.
      description: >
        Reads only the manifest icon relative to the validated plugin package root;
        callers cannot select another file or an external URL. Symlinks cannot escape
        the package root. Only regular SVG, PNG, JPEG, GIF or WebP files up to 524288
        bytes are returned. Responses are private and no-store, use nosniff, and apply
        a sandboxed Content-Security-Policy that blocks scripts and external resources.
        Missing plugins, invalid manifests, absent or unreadable icons, unsupported
        content and oversized files return 404 platform.resource_not_found without file paths.
      operationId: getPluginIcon
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PluginId'
      responses:
        '200':
          description: Declared plugin icon bytes, at most 524288 bytes.
          content:
            image/svg+xml:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: The plugin or its declared icon is unavailable (platform.resource_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'


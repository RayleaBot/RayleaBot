version: 2
description: >
  RayleaBot CLI 子命令正式契约。CLI 是本地离线恢复与运维入口，
  不承担常规在线管理面职责。命令由主程序提供受控子命令，
  文档中统一记为 raylea <subcommand>。

x-fixtures:
  - fixtures/cli/ok.reset-admin.offline.yaml
  - fixtures/cli/invalid.reset-admin.online.yaml
  - fixtures/cli/edge.reset-admin.exit-code-1.yaml
  - fixtures/cli/ok.backup.offline.yaml
  - fixtures/cli/invalid.backup.online.yaml
  - fixtures/cli/ok.restore.offline.yaml
  - fixtures/cli/invalid.restore.online.yaml
  - fixtures/cli/edge.restore.exit-code-1.yaml
  - fixtures/cli/ok.doctor.online.yaml
  - fixtures/cli/edge.doctor.offline-exit-code-1.yaml
  - fixtures/cli/ok.doctor.windows-long-paths-enabled.yaml
  - fixtures/cli/edge.doctor.windows-long-paths-disabled.yaml
  - fixtures/cli/ok.cleanup.offline.yaml
  - fixtures/cli/invalid.cleanup.online.yaml
  - fixtures/cli/ok.version-json.yaml
  - fixtures/cli/ok.update-check-json.yaml
  - fixtures/cli/ok.update-verify.yaml
  - fixtures/cli/ok.plugin-dev-sync.yaml
  - fixtures/cli/invalid.plugin-dev-sync-online.yaml
  - fixtures/cli/ok.config-init.yaml
  - fixtures/cli/invalid.config-init.online.yaml
  - fixtures/cli/ok.config-normalize.yaml
  - fixtures/cli/ok.config-validate.yaml
  - fixtures/cli/edge.config-validate.exit-code-1.yaml

x-design-source: docs/user/cli.md

x-plugin-builder-development:
  command: raylea-plugin build-go
  inspect: raylea-plugin inspect --plugin includes backend_package for Go projects, resolved using the same entrypoint rules as build-go; non-Go projects omit it.
  options:
    backend-binary: Reuse a caller-validated current-platform backend executable instead of compiling Go.
    skip-ui-build: Copy an existing ui/dist tree; dependency installation and UI freshness belong to the caller.
    archive: Defaults to true. With false, expanded must be true; emit a standard expanded artifact without ZIP or archive digest. Also supported by pack.
  rule: These options retain manifest, native executable, assets, license, notices and SBOM validation; release defaults are unchanged.

commands:
  plugin:
    name: plugin
    summary: 执行插件开发工作区的离线同步操作。
    availability:
      online: false
      offline: true
    task_model: false
    cancellable: false
    implemented: true
    subcommands:
      dev-sync:
        name: dev-sync
        summary: 通过统一 artifact 安装事务同步一个已构建的开发插件。
        availability:
          online: false
          offline: true
        description: >
          校验目标平台 artifact 后，以 development 来源执行安装或原子替换，
          保留失败前最后一个可用版本，并把新开发插件的 desired_state 设为 enabled。
          命令只接受标准构建器生成的展开目录，不执行 manifest 提供的命令。
        options:
          artifact:
            flag: --artifact
            type: path
            required: true
          source:
            flag: --source
            type: path
            required: true
        exit_codes:
          0: 开发插件已同步
          1: 数据库锁、artifact 校验、manifest 或安装事务失败
        x-fixtures:
          - fixtures/cli/ok.plugin-dev-sync.yaml
          - fixtures/cli/invalid.plugin-dev-sync-online.yaml

  config:
    name: config
    summary: 维护本地配置模板与用户配置文件。
    availability:
      online: false
      offline: true
    task_model: false
    cancellable: false
    implemented: true
    subcommands:
      init:
        name: init
        summary: 创建默认配置模板并写出规范化用户配置。
        description: >
          确保存在按当前 schema 生成的默认模板，将用户配置合并到默认值之上，
          整体通过 schema 与运行时约束校验后写出规范化配置文件。
          命令会写入配置目录；服务生命周期锁被占用时直接拒绝执行，
          必须在停服窗口运行。
        exit_codes:
          0: 配置模板与用户配置已初始化并规范化
          1: 生命周期锁、文件读写、schema 校验或运行时约束失败
        x-fixtures:
          - fixtures/cli/ok.config-init.yaml
          - fixtures/cli/invalid.config-init.online.yaml
      normalize:
        name: normalize
        summary: 按当前 schema 整理默认模板和用户配置。
        description: >
          与 init 使用同一规范化事务：确保默认模板存在、合并用户覆盖值、
          通过 schema 校验与运行时约束检查后写回规范化文档。
          服务生命周期锁被占用时直接拒绝执行；请在停服窗口运行。
        exit_codes:
          0: 配置文件已规范化
          1: 生命周期锁、文件读写、schema 校验或运行时约束失败
        x-fixtures:
          - fixtures/cli/ok.config-normalize.yaml
      validate:
        name: validate
        summary: 校验配置文件，不修改文件内容。
        description: >
          以只读方式加载默认模板与用户配置，执行 schema 校验与
          运行时约束检查，不写回任何文件；可在线或停服执行。
        availability:
          online: true
          offline: true
        exit_codes:
          0: 配置校验通过
          1: 配置缺失、schema 校验或运行时约束失败
        x-fixtures:
          - fixtures/cli/ok.config-validate.yaml
          - fixtures/cli/edge.config-validate.exit-code-1.yaml

  version:
    name: version
    summary: 输出当前构建版本与更新协议版本。
    availability:
      online: true
      offline: true
    options:
      json:
        flag: --json
        type: boolean
        required: true
        const: true
    exit_codes:
      0: 版本信息已输出
      1: 构建信息不可读
    task_model: false
    cancellable: false
    implemented: true
    x-fixtures:
      - fixtures/cli/ok.version-json.yaml

  update:
    name: update
    summary: 检查或离线验证受信任更新包。
    availability:
      online: true
      offline: true
    task_model: false
    cancellable: false
    implemented: true
    subcommands:
      check:
        name: check
        summary: 获取并验证签名发布清单，不下载或安装更新。
        availability:
          online: true
          offline: false
        options:
          json:
            flag: --json
            type: boolean
            required: true
            const: true
        exit_codes:
          0: 检查完成
          1: 网络、契约或信任校验失败
        x-fixtures:
          - fixtures/cli/ok.update-check-json.yaml
      verify:
        name: verify
        summary: 离线验证发布清单、签名 envelope 与 artifact。
        availability:
          online: true
          offline: true
        options:
          manifest:
            flag: --manifest
            type: path
            required: true
          signature:
            flag: --signature
            type: path
            required: true
          artifact:
            flag: --artifact
            type: path
            required: true
        exit_codes:
          0: 契约、签名和 artifact 校验通过
          1: 任一校验失败
        x-fixtures:
          - fixtures/cli/ok.update-verify.yaml

  reset-admin:
    name: reset-admin
    summary: 重置管理员凭据并重新进入初始化向导。
    availability:
      online: false
      offline: true
    description: >
      清除 auth_bootstrap_state 与 admin_sessions，使服务下次启动时
      重新进入 setup_required 状态。必须在停服窗口执行，避免与运行中
      的 auth.Manager 竞争写入。
    exit_codes:
      0: 重置成功
      1: 数据库访问失败或锁冲突
    task_model: false
    cancellable: false
    implemented: true
    x-fixtures:
      - fixtures/cli/ok.reset-admin.offline.yaml
      - fixtures/cli/invalid.reset-admin.online.yaml
      - fixtures/cli/edge.reset-admin.exit-code-1.yaml

  backup:
    name: backup
    summary: 导出恢复用备份包。
    availability:
      online: false
      offline: true
    description: >
      在停服窗口导出 config/user.yaml、SQLite 一致性快照、data/ 下的
      非数据库运行数据与 plugins/installed/，同步生成可恢复备份包。
      运行中的在线备份只通过管理 API 创建 backup.create 异步任务。
    exit_codes:
      0: 备份成功
      1: 备份失败
    task_model: false
    cancellable: false
    implemented: true
    x-fixtures:
      - fixtures/cli/ok.backup.offline.yaml
      - fixtures/cli/invalid.backup.online.yaml

  restore:
    name: restore
    summary: 从受支持的恢复包恢复数据。
    availability:
      online: false
      offline: true
    description: >
      在停服窗口下从受支持的恢复包恢复 config/、data/ 与
      plugins/installed/。restore 会先读取 backup-manifest.json，
      生成统一 recovery_summary 并在 `logs/recovery-summary.json`
      中落盘。硬不兼容时恢复在解包前失败；通过预检时继续恢复，
      并把后续启动期资源 / 插件兼容检查标记为待完成。
    arguments:
      - name: backup_path
        type: path
        required: true
        description: 待恢复的备份 ZIP 文件路径。
    exit_codes:
      0: 恢复成功
      1: 恢复包格式错误或恢复失败
    task_model: false
    cancellable: false
    implemented: true
    x-fixtures:
      - fixtures/cli/ok.restore.offline.yaml
      - fixtures/cli/invalid.restore.online.yaml
      - fixtures/cli/edge.restore.exit-code-1.yaml

  doctor:
    name: doctor
    summary: 执行本地配置、SQLite 快速完整性与依赖元数据检查。
    availability:
      online: true
      offline: true
    description: >
      检查配置文件可访问性、配置 schema 可用性、SQLite quick_check、
      .deps/ v5 清单的当前平台项、Chromium 与 FFmpeg 元数据，以及退役插件运行时
      配置键。存在恢复摘要时附带 recovery_summary；Windows 上额外检查
      LongPathsEnabled 注册表项。
    exit_codes:
      0: 所有检查通过
      1: 存在 WARN 或 ERROR 级别问题
    task_model: false
    cancellable: false
    implemented: true
    x-doctor-issues:
      windows_long_paths:
        registry_key: HKLM\SYSTEM\CurrentControlSet\Control\FileSystem\LongPathsEnabled
        outcomes:
          enabled:
            code: windows.long_paths_enabled
            severity: ok
          disabled:
            code: windows.long_paths_disabled
            severity: warning
          unavailable:
            code: windows.long_paths_unavailable
            severity: warning
    x-fixtures:
      - fixtures/cli/ok.doctor.online.yaml
      - fixtures/cli/edge.doctor.offline-exit-code-1.yaml
      - fixtures/cli/ok.doctor.windows-long-paths-enabled.yaml
      - fixtures/cli/edge.doctor.windows-long-paths-disabled.yaml

  cleanup:
    name: cleanup
    summary: 回收可重建缓存与遗留临时目录。
    availability:
      online: false
      offline: true
    description: >
      在停服窗口回收超过 data.download_cache_retention_days 的
      cache/downloads/ 条目、超过 7 天的 data/render/ 缓存与超过
      24 小时的失败安装临时目录。不触碰 config/、状态库和插件业务数据。
    exit_codes:
      0: 清理成功
      1: 清理过程中遇到错误
    task_model: false
    cancellable: false
    implemented: true
    x-fixtures:
      - fixtures/cli/ok.cleanup.offline.yaml
      - fixtures/cli/invalid.cleanup.online.yaml

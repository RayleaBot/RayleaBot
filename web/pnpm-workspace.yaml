packages:
  - "."

supportedArchitectures:
  os:
    - win32
    - linux
    - darwin
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl

allowBuilds:
  "@parcel/watcher": true
  core-js: false
  esbuild: true

overrides:
  esbuild: 0.28.2
  glob: 13.0.6
  immutable: 5.1.9
  js-cookie: 3.0.8
  js-yaml: 4.2.0
  picomatch: 4.0.5
  postcss: 8.5.26

packages:
  - "."

supportedArchitectures:
  os:
    - win32
    - linux
    - darwin
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl

allowBuilds:
  "@parcel/watcher": true
  core-js: false
  esbuild: true
  # Select Vue 3 exports for the Reka/Floating UI compatibility dependency.
  vue-demi: true

overrides:
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  esbuild: 0.28.2
  glob: 13.0.6
  immutable: 5.1.9
  js-cookie: 3.0.8
  js-yaml: 4.3.2
  picomatch: 4.0.5
  postcss: 8.5.26
  source-map-js: 1.2.2
  undici: 8.10.2

packages:
  - "."

supportedArchitectures:
  os:
    - win32
    - linux
    - darwin
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl

allowBuilds:
  "@parcel/watcher": true
  core-js: false
  esbuild: true

overrides:
  esbuild: 0.28.1
  glob: 10.5.0
  immutable: 5.1.8
  js-cookie: 3.0.7
  js-yaml: 4.2.0
  picomatch: 4.0.4
  postcss: 8.5.18

name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.detect.outputs.server }}
      web: ${{ steps.detect.outputs.web }}
      launcher: ${{ steps.detect.outputs.launcher }}
      sdk: ${{ steps.detect.outputs.sdk }}
      contracts: ${{ steps.detect.outputs.contracts }}
      release: ${{ steps.detect.outputs.release }}
      docs: ${{ steps.detect.outputs.docs }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      ci: ${{ steps.detect.outputs.ci }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/ci/detect_changes.py --base "$BASE_SHA" --head "$HEAD_SHA"

  contracts-lite:
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install contract validators
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema==4.26.0

      - name: Validate contracts
        run: python scripts/ci/validate_contracts.py --mode=strict

  server:
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0

      - name: Run server doctor
        run: make doctor

      - name: Check embedded schema drift
        run: node scripts/generate-runtime-schemas.mjs --verify

      - name: Run go test
        working-directory: server
        run: go test ./...

      - name: Build server
        working-directory: server
        run: mkdir -p dist && go build -o dist/raylea-server ./cmd/raylea-server

      - name: Run binary vulnerability scan
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -mode=binary dist/raylea-server

      - name: Check sqlc generated code drift
        working-directory: server
        run: sqlc diff

  design-system:
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.launcher == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Check design token generation and color drift
        run: node scripts/generate-design-tokens.mjs --check

  web:
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Audit Web production dependencies
        working-directory: web
        run: pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org

      - name: Check generated types drift
        working-directory: web
        run: |
          pnpm generate:types
          git diff --exit-code src/types/generated.ts src/types/websocket.generated.ts

      - name: Run web typecheck
        working-directory: web
        run: pnpm run typecheck

      - name: Run web tests
        working-directory: web
        run: pnpm test

      - name: Build web
        working-directory: web
        run: pnpm build

  launcher:
    if: needs.changes.outputs.launcher == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml

      - name: Install launcher dependencies
        working-directory: launcher
        run: pnpm install --frozen-lockfile

      - name: Audit Launcher production dependencies
        working-directory: launcher
        run: pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org

      - name: Check generated types drift
        working-directory: launcher
        run: |
          pnpm generate:types
          git diff --exit-code src/shared/web-api.generated.ts

      - name: Run launcher typecheck
        working-directory: launcher
        run: pnpm run typecheck

      - name: Run launcher tests
        working-directory: launcher
        run: pnpm test

      - name: Build launcher
        working-directory: launcher
        run: pnpm build

  sdk:
    if: needs.changes.outputs.sdk == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: plugins/runtime/nodejs/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python package build tools
        run: python -m pip install --disable-pip-version-check build

      - name: Check SDK and runtime license copies
        run: |
          cmp LICENSE sdk/nodejs/LICENSE
          cmp LICENSE sdk/python/LICENSE
          cmp LICENSE plugins/runtime/nodejs/LICENSE
          cmp LICENSE plugins/runtime/python/LICENSE

      - name: Install Node runtime dependencies
        working-directory: plugins/runtime/nodejs
        run: npm ci

      - name: Build Node runtime
        working-directory: plugins/runtime/nodejs
        run: npm run build

      - name: Check Node runtime dist drift
        working-directory: plugins/runtime/nodejs
        run: |
          git diff --exit-code -- dist
          test -z "$(git status --porcelain --untracked-files=all -- dist)"

      - name: Run Node runtime typecheck
        working-directory: plugins/runtime/nodejs
        run: npm run typecheck

      - name: Run Node runtime tests
        working-directory: plugins/runtime/nodejs
        run: node --test tests/*.test.mjs

      - name: Check Node runtime package contents
        working-directory: plugins/runtime/nodejs
        run: npm pack --dry-run --json | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => { const files = JSON.parse(input)[0].files.map(file => file.path); if (!files.includes('LICENSE')) process.exit(1); });"

      - name: Check Node SDK package metadata
        working-directory: sdk/nodejs
        run: |
          npm pack --dry-run --json | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => { const pack = JSON.parse(input)[0]; const files = pack.files.map(file => file.path); const pkg = require('./package.json'); if (!files.includes('LICENSE') || pkg.dependencies['@rayleabot/plugin-runtime'] !== pkg.version || pkg.main || pkg.types) process.exit(1); });"

      - name: Run Python plugin runtime tests
        working-directory: plugins/runtime/python
        run: python -m unittest discover -s tests

      - name: Run Python SDK package tests
        working-directory: sdk/python
        run: python -m unittest discover -s tests

      - name: Build and install Python runtime and SDK packages
        run: |
          python -m build --outdir "$RUNNER_TEMP/rayleabot-python-runtime" plugins/runtime/python
          python -m build --outdir "$RUNNER_TEMP/rayleabot-python-sdk" sdk/python
          python -m venv "$RUNNER_TEMP/rayleabot-python-sdk-venv"
          "$RUNNER_TEMP/rayleabot-python-sdk-venv/bin/python" -m pip install --no-index --find-links "$RUNNER_TEMP/rayleabot-python-runtime" "$RUNNER_TEMP"/rayleabot-python-sdk/*.whl
          "$RUNNER_TEMP/rayleabot-python-sdk-venv/bin/python" -c "import importlib.util, rayleabot_runtime; assert rayleabot_runtime.RayleaBotPlugin; assert importlib.util.find_spec('rayleabot') is None"
          python -c "import glob, zipfile; wheels=glob.glob('$RUNNER_TEMP/rayleabot-python-runtime/*.whl') + glob.glob('$RUNNER_TEMP/rayleabot-python-sdk/*.whl'); assert len(wheels) == 2, wheels; assert all(any(name.endswith('/LICENSE') for name in zipfile.ZipFile(wheel).namelist()) for wheel in wheels), wheels"

  release-helper:
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Check release scripts
        run: |
          python -m py_compile scripts/release/*.py
          python -m unittest discover -s scripts/release/tests

      - name: Build Windows launcher entry
        shell: bash
        run: |
          mkdir -p dist/launcher-entry
          (cd server && GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H=windowsgui -s -w" -o ../dist/launcher-entry/RayleaLauncher.exe ../launcher/native/windows-entry/main_windows.go)
          test -s dist/launcher-entry/RayleaLauncher.exe

  third-party-notices:
    if: >-
      needs.changes.outputs.server == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.launcher == 'true' ||
      needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Install production graph inputs
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir launcher install --frozen-lockfile
          cd server && go mod download

      - name: Check third-party notice drift
        run: python scripts/release/generate_third_party_notices.py --check --output THIRD_PARTY_NOTICES.md

  agent-docs:
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check agent docs
        run: |
          node scripts/check-agent-docs.mjs
          python scripts/check-doc-links.py

  ci-self-check:
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install contract validators
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema==4.26.0

      - name: Check CI scripts
        run: |
          python -m py_compile scripts/ci/*.py
          python -m unittest scripts.tests.test_check_doc_links
          python scripts/ci/detect_changes.py --self-test
          python scripts/ci/validate_contracts.py --mode=strict

  ci-required:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - changes
      - contracts-lite
      - server
      - design-system
      - web
      - launcher
      - sdk
      - release-helper
      - third-party-notices
      - agent-docs
      - ci-self-check

    steps:
      - name: Check required CI result
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          allowed = {"success", "skipped"}
          failed = {name: data["result"] for name, data in needs.items() if data["result"] not in allowed}
          for name, data in sorted(needs.items()):
              print(f"{name}: {data['result']}")
          if failed:
              print(f"ci-required failed: {failed}", file=sys.stderr)
              raise SystemExit(1)
          print("ci-required passed")
          PY

name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.detect.outputs.server }}
      web: ${{ steps.detect.outputs.web }}
      launcher: ${{ steps.detect.outputs.launcher }}
      sdk: ${{ steps.detect.outputs.sdk }}
      contracts: ${{ steps.detect.outputs.contracts }}
      release: ${{ steps.detect.outputs.release }}
      docs: ${{ steps.detect.outputs.docs }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      ci: ${{ steps.detect.outputs.ci }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Detect changed areas
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/ci/detect_changes.py --base "$BASE_SHA" --head "$HEAD_SHA"

  contracts-lite:
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go for generators
        uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go/go.mod
          cache: false

      - name: Setup Node for schema copies
        uses: actions/setup-node@v7
        with:
          node-version: "26.7.0"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Install contract validators
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3 jsonschema==4.26.0

      - name: Validate contracts
        run: |
          node scripts/generate-runtime-schemas.mjs --verify
          python scripts/generate-error-codes.py --verify
          python scripts/generate-plugin-wire.py --verify
          python scripts/ci/validate_contracts.py --self-test
          python scripts/ci/validate_contracts.py --mode=strict

  server:
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.7.0"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Install Corepack
        run: npm install --global corepack@0.35.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Run server doctor
        run: make doctor

      - name: Check embedded schema drift
        run: node scripts/generate-runtime-schemas.mjs --verify

      - name: Check generated plugin protocol and error catalogs
        run: |
          python -m pip install --disable-pip-version-check pyyaml==6.0.3 jsonschema==4.26.0
          python scripts/generate-plugin-wire.py --verify
          python scripts/generate-error-codes.py --verify

      - name: Run go test
        working-directory: server
        run: go test ./...

      - name: Run core concurrency tests
        working-directory: server
        env:
          CGO_ENABLED: "1"
        run: >-
          go test -race
          ./internal/app ./internal/configruntime ./internal/eventpipeline/...
          ./internal/plugins/catalog ./internal/plugins/runtime ./internal/plugins/lifecycle
          ./internal/pubsub ./internal/bot/adapters ./internal/management/events ./internal/onebot11 ./internal/storage

      - name: Run core Go lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: server
          args: --timeout=10m --default=none -E errcheck -E staticcheck -E govet -E unused -E ineffassign ./...

      - name: Build server
        working-directory: server
        run: mkdir -p dist && go build -o dist/raylea-server ./cmd/raylea-server

      - name: Run binary vulnerability scan
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -mode=binary dist/raylea-server

      - name: Check sqlc generated code drift
        working-directory: server
        run: sqlc diff

  server-windows:
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: windows-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Test Windows installation and locking
        working-directory: server
        run: go test ./internal/plugins/lifecycle ./internal/releaseupdate ./internal/filelock -count=1

  design-system:
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.launcher == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.7.0"

      - name: Check design token generation and color drift
        run: node scripts/generate-design-tokens.mjs --check

  web:
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.7.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Corepack and activate pnpm
        run: |
          npm install --global corepack@0.35.0
          corepack prepare pnpm@11.22.0 --activate

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Audit Web production dependencies
        working-directory: web
        run: pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org

      - name: Check generated types drift
        working-directory: web
        run: |
          pnpm generate:types
          git diff --exit-code src/types/generated.ts src/types/websocket.generated.ts

      - name: Check web indentation
        working-directory: web
        run: pnpm run check:indent

      - name: Run web typecheck
        working-directory: web
        run: pnpm run typecheck

      - name: Run web tests
        working-directory: web
        run: pnpm test

      - name: Build web
        working-directory: web
        run: pnpm build

  launcher:
    if: needs.changes.outputs.launcher == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: launcher/go.mod
          cache-dependency-path: launcher/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.7.0"
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml

      - name: Install launcher dependencies
        working-directory: launcher
        run: pnpm install --frozen-lockfile

      - name: Install Wails Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Audit Launcher production dependencies
        working-directory: launcher
        run: pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org

      - name: Check generated types drift
        working-directory: launcher
        run: |
          pnpm generate:types
          pnpm generate:wails
          git diff --exit-code src/shared/web-api.generated.ts src/renderer/bindings
          untracked_bindings="$(git ls-files --others -- src/renderer/bindings)"
          if [ -n "$untracked_bindings" ]; then
            printf 'Untracked Wails bindings:\n%s\n' "$untracked_bindings"
            exit 1
          fi

      - name: Run launcher typecheck
        working-directory: launcher
        run: pnpm run typecheck

      - name: Run launcher tests
        working-directory: launcher
        run: pnpm test

      - name: Build launcher
        working-directory: launcher
        run: pnpm build

  plugins:
    if: needs.changes.outputs.sdk == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: |
            sdk/go/go.mod
            sdk/go/go.sum
            examples/plugins/*/go.mod
            examples/plugins/*/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.7.0"

      - name: Setup Python for protocol generation
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Check generated plugin wire drift
        run: |
          python -m pip install --disable-pip-version-check pyyaml==6.0.3 jsonschema==4.26.0
          python scripts/generate-plugin-wire.py --verify

      - name: Run Go SDK and example race tests
        shell: bash
        run: |
          set -euo pipefail
          for module in sdk/go examples/plugins/*; do
            if [ -f "$module/go.mod" ]; then
              (cd "$module" && GOWORK=off go test -race ./...)
            fi
          done

      - name: Install Vue SDK and example UI dependencies
        shell: bash
        run: |
          set -euo pipefail
          for project in sdk/vue examples/plugins/example-config-panel/ui; do
            pnpm --dir "$project" install --frozen-lockfile
            pnpm --dir "$project" typecheck
            pnpm --dir "$project" test
            pnpm --dir "$project" build
          done

      - name: Test plugin development workspace
        run: node --test scripts/tests/plugin-dev-workspace.test.mjs

  release-helper:
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Check release scripts
        run: |
          python -m py_compile scripts/release/*.py
          python -m unittest discover -s scripts/release/tests

  third-party-notices:
    if: >-
      needs.changes.outputs.server == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.launcher == 'true' ||
      needs.changes.outputs.sdk == 'true' ||
      needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.7.0"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Install production graph inputs
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir launcher install --frozen-lockfile
          cd server && go mod download

      - name: Check third-party notice drift
        run: python scripts/release/generate_third_party_notices.py --check --output THIRD_PARTY_NOTICES.md

  agent-docs:
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.7.0"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Check agent docs
        run: |
          node scripts/check-agent-docs.mjs
          python scripts/check-doc-links.py

  ci-self-check:
    if: needs.changes.outputs.ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go for generator self-tests
        uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go/go.mod
          cache: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.7.0"

      - name: Install contract validators
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3 jsonschema==4.26.0

      - name: Check CI scripts
        run: |
          python -m compileall -q scripts/ci
          python -m unittest discover -s scripts/tests -p "test_*.py"
          node --test "scripts/tests/*.test.mjs"
          python scripts/ci/detect_changes.py --self-test
          python scripts/generate-error-codes.py --verify
          python scripts/generate-plugin-wire.py --verify
          python scripts/ci/validate_contracts.py --self-test
          python scripts/ci/validate_contracts.py --mode=strict

  ci-required:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - changes
      - contracts-lite
      - server
      - server-windows
      - design-system
      - web
      - launcher
      - plugins
      - release-helper
      - third-party-notices
      - agent-docs
      - ci-self-check

    steps:
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Check required CI result
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          allowed = {"success", "skipped"}
          failed = {name: data["result"] for name, data in needs.items() if data["result"] not in allowed}
          for name, data in sorted(needs.items()):
              print(f"{name}: {data['result']}")
          if failed:
              print(f"ci-required failed: {failed}", file=sys.stderr)
              raise SystemExit(1)
          print("ci-required passed")
          PY

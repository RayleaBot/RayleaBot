name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve tag version
        id: version
        shell: bash
        run: printf 'value=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.version.outputs.value }}
      release_notes_ref: ${{ format('https://github.com/{0}/releases/tag/{1}', github.repository, github.ref_name) }}
    secrets:
      RAYLEA_RELEASE_SIGNING_KEY_PEM: ${{ secrets.RAYLEA_RELEASE_SIGNING_KEY_PEM }}
      RAYLEA_RELEASE_NEXT_KEY_PEM: ${{ secrets.RAYLEA_RELEASE_NEXT_KEY_PEM }}
      RAYLEA_WINDOWS_CERT_SHA1: ${{ secrets.RAYLEA_WINDOWS_CERT_SHA1 }}

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download verified release packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist/downloads
      - name: Download verified release metadata
        uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: dist/release
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: RayleaBot ${{ github.ref_name }}
          body_path: docs/release/notes/${{ github.ref_name }}.md
          files: |
            dist/downloads/package-windows-x64-full/*.zip
            dist/downloads/package-linux-x64-full/*.tar.gz
            dist/downloads/package-macos-arm64-full/*.tar.gz
            dist/downloads/package-linux-x64-server/*.tar.gz
            dist/release/release_manifest.v2.json
            dist/release/release_manifest.v2.sig.json
            dist/release/SHA256SUMS.txt

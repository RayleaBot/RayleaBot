name: nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-full:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/tool-versions

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.nodejs }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.toolchain.outputs.python }}

      - name: Install Corepack
        run: npm install --global corepack@${{ steps.toolchain.outputs.corepack }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v${{ steps.toolchain.outputs.sqlc }}

      - name: Run server doctor
        run: make doctor

      - name: Run Go race tests with coverage
        shell: bash
        working-directory: server
        run: |
          set -euo pipefail
          go test -race -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | awk '/^total:/ {print "Go coverage total: " $3}'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: server
          args: --timeout=10m --default=none -E errcheck -E staticcheck -E govet -E unused -E ineffassign ./...

  server-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run govulncheck
        shell: bash
        working-directory: server
        run: |
          set -euo pipefail
          tmp_bin="$(mktemp)"
          trap 'rm -f "$tmp_bin"' EXIT
          go build -o "$tmp_bin" ./cmd/raylea-server
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -mode=binary "$tmp_bin"

  web-full:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/tool-versions

      - name: Setup Go for real Server E2E
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.nodejs }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run web coverage
        working-directory: web
        run: pnpm test:coverage

      - name: Install Playwright browser
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run web E2E
        working-directory: web
        run: pnpm test:e2e

      - name: Build web
        working-directory: web
        run: pnpm build

      - name: Run production web E2E
        working-directory: web
        run: pnpm exec playwright test --config playwright.production.config.ts

  launcher-full:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/tool-versions

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: launcher/go.mod
          cache-dependency-path: launcher/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.nodejs }}
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml

      - name: Install launcher dependencies
        working-directory: launcher
        run: pnpm install --frozen-lockfile

      - name: Install Wails Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Run launcher coverage
        working-directory: launcher
        run: pnpm test:coverage

      - name: Install launcher Playwright browser
        working-directory: launcher
        run: pnpm exec playwright install --with-deps chromium

      - name: Run launcher renderer E2E
        working-directory: launcher
        run: pnpm test:e2e

      - name: Build launcher
        working-directory: launcher
        run: pnpm build

  contracts-strict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/tool-versions

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.toolchain.outputs.python }}

      - name: Install contract validators
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3 jsonschema==4.26.0

      - name: Validate contracts strictly
        run: |
          python scripts/generate-error-codes.py --verify
          python scripts/generate-plugin-wire.py --verify
          python scripts/generate-launcher-api.py --verify
          python scripts/ci/validate_contracts.py --mode=strict

  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/tool-versions

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.nodejs }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run web dependency audit
        working-directory: web
        run: pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org

      - name: Install launcher dependencies
        working-directory: launcher
        run: pnpm install --frozen-lockfile

      - name: Run launcher dependency audit
        working-directory: launcher
        run: pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org

  release-dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/tool-versions

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.nodejs }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.toolchain.outputs.python }}

      - name: Run release helper tests
        run: python -m unittest discover -s scripts/release/tests

      - name: Build server
        run: |
          mkdir -p dist/server
          (cd server && go build -o ../dist/server/raylea-server ./cmd/raylea-server)

      - name: Install recovery rehearsal dependency
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3 jsonschema==4.26.0

      - name: Rehearse fresh initialization and current-format recovery
        run: python scripts/release/rehearse_current_recovery.py --server dist/server/raylea-server --output dist/current-recovery-rehearsal

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build web
        working-directory: web
        run: pnpm build

      - name: Package linux server artifact
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release/package_artifact.py \
            --artifact-id linux-x64-server \
            --version 9999.0.0-nightly \
            --git-commit "$(git rev-parse --short HEAD)" \
            --release-notes-ref "https://github.com/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml" \
            --server-bin dist/server/raylea-server \
            --systemd-file packaging/systemd/rayleabot.service \
            --output-dir dist/release \
            --run-smoke

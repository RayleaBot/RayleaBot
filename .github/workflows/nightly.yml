name: nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/tool-versions

      - name: Setup Go for generator self-tests
        uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go/go.mod
          cache: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.toolchain.outputs.python }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.nodejs }}

      - name: Install Corepack
        run: npm install --global corepack@${{ steps.toolchain.outputs.corepack }}

      - name: Install contract validators
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3 jsonschema==4.26.0

      - name: Test repository scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts
          python -m unittest discover -s scripts/tests -p "test_*.py"
          node --test "scripts/tests/*.test.mjs"

      - name: Validate contracts and generated outputs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/validate_contracts.py --self-test
          python scripts/ci/validate_contracts.py --mode=strict
          node scripts/generate-runtime-schemas.mjs --verify
          python scripts/generate-error-codes.py --verify
          python scripts/generate-plugin-wire.py --verify

      - name: Check docs and design assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-agent-docs.mjs
          python scripts/check-doc-links.py
          node scripts/generate-design-tokens.mjs --check

  server:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/tool-versions

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.nodejs }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.toolchain.outputs.python }}

      - name: Install Corepack
        run: npm install --global corepack@${{ steps.toolchain.outputs.corepack }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v${{ steps.toolchain.outputs.sqlc }}

      - name: Run server doctor
        run: make doctor

      - name: Run Go race tests with coverage
        shell: bash
        working-directory: server
        run: |
          set -euo pipefail
          go test -race -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | awk '/^total:/ {print "Go coverage total: " $3}'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          working-directory: server
          args: --timeout=10m --default=none -E errcheck -E staticcheck -E govet -E unused -E ineffassign ./...

      - name: Run golangci-lint for Windows sources
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: windows
        with:
          version: v2.13.0
          working-directory: server
          args: --timeout=10m --default=none -E errcheck -E staticcheck -E govet -E unused -E ineffassign ./...

      - name: Build server
        working-directory: server
        run: mkdir -p dist && go build -o dist/raylea-server ./cmd/raylea-server

      - name: Run binary vulnerability scan
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -mode=binary dist/raylea-server

      - name: Check sqlc generated code drift
        working-directory: server
        run: sqlc diff

  server-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run Go tests on Windows
        working-directory: server
        run: go test -count=1 ./...

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/tool-versions

      - name: Setup Go for real Server E2E
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.nodejs }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Corepack
        run: npm install --global corepack@${{ steps.toolchain.outputs.corepack }}

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Check generated types drift
        working-directory: web
        run: |
          pnpm generate:types
          git diff --exit-code src/types/generated.ts src/types/websocket.generated.ts

      - name: Check web indentation
        working-directory: web
        run: pnpm run check:indent

      - name: Run web typecheck
        working-directory: web
        run: pnpm run typecheck

      - name: Run web coverage
        working-directory: web
        run: pnpm test:coverage

      - name: Install Playwright browser
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Build web and run production E2E
        working-directory: web
        run: pnpm test:e2e:production

  launcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/tool-versions

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: launcher/go.mod
          cache-dependency-path: launcher/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.nodejs }}
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml

      - name: Install launcher dependencies
        working-directory: launcher
        run: pnpm install --frozen-lockfile

      - name: Install Wails Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Check Wails bindings drift
        working-directory: launcher
        run: |
          pnpm generate:wails
          git diff --exit-code src/renderer/bindings
          untracked_bindings="$(git ls-files --others -- src/renderer/bindings)"
          if [ -n "$untracked_bindings" ]; then
            printf 'Untracked Wails bindings:\n%s\n' "$untracked_bindings"
            exit 1
          fi

      - name: Run launcher typecheck
        working-directory: launcher
        run: pnpm run typecheck

      - name: Run launcher coverage
        working-directory: launcher
        run: pnpm test:coverage

      - name: Install launcher Playwright browser
        working-directory: launcher
        run: pnpm exec playwright install --with-deps chromium

      - name: Run launcher renderer E2E
        working-directory: launcher
        run: pnpm test:e2e

      - name: Build launcher
        working-directory: launcher
        run: pnpm build

  plugins:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/tool-versions

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: |
            sdk/go/go.mod
            sdk/go/go.sum
            examples/plugins/*/go.mod
            examples/plugins/*/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.nodejs }}

      - name: Run Go SDK and example race tests
        shell: bash
        run: |
          set -euo pipefail
          for module in sdk/go examples/plugins/*; do
            if [ -f "$module/go.mod" ]; then
              (cd "$module" && GOWORK=off go test -race ./...)
            fi
          done

      - name: Check Vue SDK and example UI
        shell: bash
        run: |
          set -euo pipefail
          for project in sdk/vue examples/plugins/example-config-panel/ui; do
            pnpm --dir "$project" install --frozen-lockfile
            pnpm --dir "$project" typecheck
            pnpm --dir "$project" test
            pnpm --dir "$project" build
          done

  dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/tool-versions

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.nodejs }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.toolchain.outputs.python }}

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run web dependency audit
        working-directory: web
        run: pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org

      - name: Install launcher dependencies
        working-directory: launcher
        run: pnpm install --frozen-lockfile

      - name: Run launcher dependency audit
        working-directory: launcher
        run: pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org

      - name: Download server modules
        working-directory: server
        run: go mod download

      - name: Check third-party notice drift
        run: python scripts/release/generate_third_party_notices.py --check --output THIRD_PARTY_NOTICES.md

  release-dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/tool-versions

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.nodejs }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.toolchain.outputs.python }}

      - name: Install recovery rehearsal dependency
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3 jsonschema==4.26.0

      - name: Run release helper tests
        run: python -m unittest discover -s scripts/release/tests

      - name: Build server
        run: |
          mkdir -p dist/server
          (cd server && go build -o ../dist/server/raylea-server ./cmd/raylea-server)

      - name: Rehearse fresh initialization and current-format recovery
        run: python scripts/release/rehearse_current_recovery.py --server dist/server/raylea-server --output dist/current-recovery-rehearsal

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build web
        working-directory: web
        run: pnpm build

      - name: Package linux server artifact
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release/package_artifact.py \
            --artifact-id linux-x64-server \
            --version 9999.0.0-nightly \
            --git-commit "$(git rev-parse --short HEAD)" \
            --release-notes-ref "https://github.com/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml" \
            --server-bin dist/server/raylea-server \
            --systemd-file packaging/systemd/rayleabot.service \
            --output-dir dist/release \
            --run-smoke

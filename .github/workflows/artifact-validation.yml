name: artifact-validation

on:
  push:
    branches:
      - "codex/validation-*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build without creating a tag or release.
        type: string
        default: "0.4.0"
        required: true

permissions:
  contents: read

concurrency:
  group: artifact-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ inputs.version || '0.4.0' }}
      release_notes_ref: ${{ format('https://github.com/{0}/blob/{1}/docs/release/notes/v{2}.md', github.repository, github.sha, inputs.version || '0.4.0') }}
    secrets:
      RAYLEA_RELEASE_SIGNING_KEY_PEM: ${{ secrets.RAYLEA_RELEASE_SIGNING_KEY_PEM }}
      RAYLEA_RELEASE_NEXT_KEY_PEM: ${{ secrets.RAYLEA_RELEASE_NEXT_KEY_PEM }}
      RAYLEA_WINDOWS_CERT_SHA1: ${{ secrets.RAYLEA_WINDOWS_CERT_SHA1 }}

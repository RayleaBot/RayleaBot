name: browser-diagnostic

on:
  push:
    branches:
      - "codex/browser-diagnostic-*"

permissions:
  contents: read

jobs:
  native-windows:
    name: Windows browser timing (${{ matrix.mode }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, foreground]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Real help.menu first on fresh runner - unchanged 30s request budget
        working-directory: server
        shell: pwsh
        run: |
          if ('${{ matrix.mode }}' -eq 'foreground') { $env:RAYLEA_DIAGNOSTIC_BRING_TO_FRONT = '1' }
          go test -v -count=1 -timeout=2m -run '^TestDiagnosticRealHelpMenuColdThenSecondRender$' ./internal/render 2>&1 | Tee-Object -FilePath ../browser-cold.log
          exit $LASTEXITCODE
      - name: Follow-up real help.menu on the same warmed OS
        if: always()
        working-directory: server
        shell: pwsh
        run: |
          if ('${{ matrix.mode }}' -eq 'foreground') { $env:RAYLEA_DIAGNOSTIC_BRING_TO_FRONT = '1' }
          go test -v -count=1 -timeout=2m -run '^TestDiagnosticRealHelpMenuColdThenSecondRender$' ./internal/render 2>&1 | Tee-Object -FilePath ../browser-warmed.log
          exit $LASTEXITCODE
      - name: Preserve experiment logs including failed tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostic-${{ matrix.mode }}
          if-no-files-found: error
          path: |
            browser-cold.log
            browser-warmed.log

name: self-host-smoke

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: Artifact to package and probe
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-x64-full
          - linux-x64-full
          - linux-x64-server
          - macos-arm64-full
      window_seconds:
        description: Long self-host smoke window in seconds
        required: true
        default: "600"
        type: string
      probe_interval_seconds:
        description: Probe interval in seconds
        required: true
        default: "30"
        type: string

env:
  SMOKE_VERSION: 9999.0.0-self-host

permissions:
  contents: read

jobs:
  package-and-probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_id: windows-x64-full
            recovery_fixture_target: windows-x64
            runner: windows-latest
            server_bin: dist/server/raylea-server.exe
            launcher_required: true
            launcher_bundle: launcher/dist/package/win-unpacked
            systemd_file: ""
          - artifact_id: linux-x64-full
            recovery_fixture_target: linux-x64
            runner: ubuntu-latest
            server_bin: dist/server/raylea-server
            launcher_required: true
            launcher_bundle: launcher/dist/package/linux-unpacked
            systemd_file: ""
          - artifact_id: linux-x64-server
            recovery_fixture_target: linux-x64
            runner: ubuntu-latest
            server_bin: dist/server/raylea-server
            launcher_required: false
            launcher_bundle: ""
            systemd_file: packaging/systemd/rayleabot.service
          - artifact_id: macos-arm64-full
            recovery_fixture_target: macos-arm64
            runner: macos-26
            server_bin: dist/server/raylea-server
            launcher_required: true
            launcher_bundle: launcher/dist/package/mac-arm64/RayleaLauncher.app
            systemd_file: ""
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve artifact selection
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.artifact }}" = "all" ] || [ "${{ github.event.inputs.artifact }}" = "${{ matrix.artifact_id }}" ]; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
          else
            echo "selected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.filter.outputs.selected == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup Node
        if: steps.filter.outputs.selected == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "26.7.0"

      - name: Setup pnpm
        if: steps.filter.outputs.selected == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Python
        if: steps.filter.outputs.selected == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Install recovery rehearsal dependency
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3 jsonschema==4.26.0

      - name: Build server
        if: steps.filter.outputs.selected == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/server
          if [ "${{ matrix.artifact_id }}" = "windows-x64-full" ]; then
            (cd server && go build -o ../dist/server/raylea-server.exe ./cmd/raylea-server)
            (cd server && go build -o ../dist/server/raylea-updater.exe ./cmd/raylea-updater)
          else
            (cd server && go build -o ../dist/server/raylea-server ./cmd/raylea-server)
          fi

      - name: Build recovery test plugin fixture
        if: steps.filter.outputs.selected == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/recovery-plugin
          (cd sdk/go && GOWORK=off go run ./cmd/raylea-plugin build-go --plugin "$GITHUB_WORKSPACE/server/tests/testutil/testdata/echo-plugin" --backend ./cmd/echo --target "${{ matrix.recovery_fixture_target }}" --out "$GITHUB_WORKSPACE/dist/recovery-plugin")

      - name: Install web dependencies
        if: steps.filter.outputs.selected == 'true'
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build web
        if: steps.filter.outputs.selected == 'true'
        working-directory: web
        run: pnpm build

      - name: Setup launcher Go
        if: steps.filter.outputs.selected == 'true' && matrix.launcher_required
        uses: actions/setup-go@v7
        with:
          go-version-file: launcher/go.mod
          cache-dependency-path: launcher/go.sum

      - name: Install launcher dependencies
        if: steps.filter.outputs.selected == 'true' && matrix.launcher_required
        working-directory: launcher
        run: pnpm install --frozen-lockfile

      - name: Install Wails Linux build dependencies
        if: steps.filter.outputs.selected == 'true' && matrix.artifact_id == 'linux-x64-full'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Run launcher tests
        if: steps.filter.outputs.selected == 'true' && matrix.launcher_required
        working-directory: launcher
        run: pnpm test

      - name: Build launcher
        if: steps.filter.outputs.selected == 'true' && matrix.launcher_required
        working-directory: launcher
        run: pnpm build

      - name: Package and probe artifact
        if: steps.filter.outputs.selected == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$SMOKE_VERSION"
          GIT_COMMIT="$(git rev-parse --short HEAD)"
          RELEASE_NOTES_REF="https://github.com/${GITHUB_REPOSITORY}/actions/workflows/self-host-smoke.yml"
          PACKAGE_ARGS=(
            --artifact-id "${{ matrix.artifact_id }}"
            --version "$VERSION"
            --git-commit "$GIT_COMMIT"
            --release-notes-ref "$RELEASE_NOTES_REF"
            --server-bin "${{ matrix.server_bin }}"
            --web-dist web/dist
            --deps-dir .deps
            --templates-dir templates
            --output-dir dist/release
            --run-smoke
            --run-recovery-drill
            --recovery-plugin-fixture "dist/recovery-plugin/raylea.echo-0.2.0-${{ matrix.recovery_fixture_target }}.zip"
            --run-self-host-smoke
            --window-seconds "${{ github.event.inputs.window_seconds }}"
            --probe-interval-seconds "${{ github.event.inputs.probe_interval_seconds }}"
          )
          if [ "${{ matrix.launcher_required }}" = "true" ]; then
            PACKAGE_ARGS+=(--launcher-bundle "${{ matrix.launcher_bundle }}")
          fi
          if [ "${{ matrix.artifact_id }}" = "windows-x64-full" ]; then
            PACKAGE_ARGS+=(--updater-bin dist/server/raylea-updater.exe)
          fi
          if [ -n "${{ matrix.systemd_file }}" ]; then
            PACKAGE_ARGS+=(--systemd-file "${{ matrix.systemd_file }}")
          fi
          python scripts/release/package_artifact.py "${PACKAGE_ARGS[@]}"

      - name: Upload smoke diagnostics
        if: always() && steps.filter.outputs.selected == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_id }}-self-host-smoke-diagnostics
          path: |
            dist/release/**
            logs/**
          if-no-files-found: ignore

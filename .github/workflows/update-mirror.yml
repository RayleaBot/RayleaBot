name: update-mirror

on:
  workflow_call:
    secrets:
      UPDATE_MIRROR_ACCESS_KEY:
        required: true
      UPDATE_MIRROR_SECRET_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tool-versions
        id: toolchain
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.toolchain.outputs.python }}
      - name: Install release validation dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Publish complete releases before channel metadata
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_MIRROR_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_MIRROR_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.UPDATE_MIRROR_REGION || 'auto' }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          MIRROR_BASE: ${{ vars.UPDATE_MIRROR_PUBLIC_URL }}
          MIRROR_BUCKET: ${{ vars.UPDATE_MIRROR_BUCKET }}
          MIRROR_ENDPOINT: ${{ vars.UPDATE_MIRROR_ENDPOINT }}
        run: >-
          python scripts/release/sync_update_mirror.py
          --repository "$GITHUB_REPOSITORY"
          --base-url "$MIRROR_BASE"
          --bucket "$MIRROR_BUCKET"
          --endpoint "$MIRROR_ENDPOINT"

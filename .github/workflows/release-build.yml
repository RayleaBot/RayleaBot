name: release-build

on:
  workflow_call:
    inputs:
      version:
        description: Release version without the v prefix.
        required: true
        type: string
      channel:
        description: Release channel (stable or beta), matching the version suffix.
        required: true
        type: string
      release_notes_ref:
        description: HTTPS link to the release notes for this exact commit or tag.
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_CHANNEL: ${{ inputs.channel }}
  RELEASE_NOTES_REF: ${{ inputs.release_notes_ref }}

jobs:
  check-release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/tool-versions

      - name: Setup Go for repository tools
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - name: Check release notes
        shell: bash
        run: go run ./tools/cmd/release-policy --tag "v$RELEASE_VERSION" --channel "$RELEASE_CHANNEL"

  build-full:
    needs: check-release-notes
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact_id: windows-x64-full
            server_bin: dist/server/raylea-server.exe
            launcher_bundle: launcher/dist/package/win-unpacked
            archive_suffix: .zip
          - runner: ubuntu-latest
            artifact_id: linux-x64-full
            server_bin: dist/server/raylea-server
            launcher_bundle: launcher/dist/package/linux-unpacked
            archive_suffix: .tar.gz
          - runner: macos-26
            artifact_id: macos-arm64-full
            server_bin: dist/server/raylea-server
            launcher_bundle: launcher/dist/package/mac-arm64/RayleaLauncher.app
            archive_suffix: .tar.gz
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/tool-versions

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.nodejs }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - name: Build server
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/server
          if [ "${{ matrix.artifact_id }}" = "windows-x64-full" ]; then
            (cd server && go build -o ../dist/server/raylea-server.exe ./cmd/raylea-server)
          else
            (cd server && go build -o ../dist/server/raylea-server ./cmd/raylea-server)
          fi
          if [ "${{ matrix.artifact_id }}" = "macos-arm64-full" ]; then
            codesign --force --sign - dist/server/raylea-server
          fi

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build web
        working-directory: web
        env:
          RAYLEA_BUILD_VERSION: ${{ inputs.version }}
        run: pnpm build

      - name: Setup launcher Go
        uses: actions/setup-go@v7
        with:
          go-version-file: launcher/go.mod
          cache-dependency-path: launcher/go.sum

      - name: Install launcher dependencies
        working-directory: launcher
        run: pnpm install --frozen-lockfile

      - name: Install Wails Linux build dependencies
        if: matrix.artifact_id == 'linux-x64-full'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Run launcher tests
        working-directory: launcher
        run: pnpm test

      - name: Build launcher
        working-directory: launcher
        env:
          RAYLEA_BUILD_VERSION: ${{ inputs.version }}
        run: pnpm build

      - name: Verify third-party notices
        run: go run ./tools/cmd/generate-third-party-notices --check --output THIRD_PARTY_NOTICES.md

      - name: Package full artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          GIT_COMMIT="$(git rev-parse HEAD)"
          PLATFORM_ARGS=(--artifact-id "${{ matrix.artifact_id }}")
          go run ./tools/cmd/package-artifact \
            --version "$VERSION" \
            --git-commit "$GIT_COMMIT" \
            --release-notes-ref "$RELEASE_NOTES_REF" \
            --server-bin "${{ matrix.server_bin }}" \
            --launcher-bundle "${{ matrix.launcher_bundle }}" \
            --web-dist web/dist \
            --deps-dir .deps \
            --templates-dir templates \
            --license-file LICENSE \
            --third-party-notices THIRD_PARTY_NOTICES.md \
            --output-dir dist/release \
            --evidence-dir "dist/evidence/${{ matrix.artifact_id }}" \
            --run-smoke \
            "${PLATFORM_ARGS[@]}"

      - name: Upload full release artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.artifact_id }}
          if-no-files-found: error
          path: |
            dist/release/RayleaBot-v*-${{ matrix.artifact_id }}${{ matrix.archive_suffix }}
            dist/release/RayleaBot-v*-${{ matrix.artifact_id }}${{ matrix.archive_suffix }}.artifact.json

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-evidence-${{ matrix.artifact_id }}
          path: dist/evidence/${{ matrix.artifact_id }}
          if-no-files-found: warn

  build-linux-server:
    needs: check-release-notes
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/tool-versions

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.nodejs }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - name: Build server
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/server
          (cd server && go build -o ../dist/server/raylea-server ./cmd/raylea-server)

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build web
        working-directory: web
        env:
          RAYLEA_BUILD_VERSION: ${{ inputs.version }}
        run: pnpm build


      - name: Install launcher dependencies for notice audit
        working-directory: launcher
        run: pnpm install --frozen-lockfile

      - name: Verify third-party notices
        run: go run ./tools/cmd/generate-third-party-notices --check --output THIRD_PARTY_NOTICES.md

      - name: Package linux server artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          GIT_COMMIT="$(git rev-parse HEAD)"
          go run ./tools/cmd/package-artifact \
            --artifact-id linux-x64-server \
            --version "$VERSION" \
            --git-commit "$GIT_COMMIT" \
            --release-notes-ref "$RELEASE_NOTES_REF" \
            --server-bin dist/server/raylea-server \
            --web-dist web/dist \
            --deps-dir .deps \
            --templates-dir templates \
            --license-file LICENSE \
            --third-party-notices THIRD_PARTY_NOTICES.md \
            --systemd-file packaging/systemd/rayleabot.service \
            --output-dir dist/release \
            --evidence-dir dist/evidence/linux-x64-server \
            --run-smoke

      - name: Upload linux server release artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-linux-x64-server
          if-no-files-found: error
          path: |
            dist/release/RayleaBot-v*-linux-x64-server.tar.gz
            dist/release/RayleaBot-v*-linux-x64-server.tar.gz.artifact.json

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-evidence-linux-x64-server
          path: dist/evidence/linux-x64-server
          if-no-files-found: warn

  assemble:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs:
      - build-full
      - build-linux-server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/tool-versions

      - name: Setup Go for repository tools
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist/downloads

      - name: Generate release metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          GIT_COMMIT="$(git rev-parse HEAD)"
          CONFIG_SCHEMA_VERSION="$(go run ./tools/cmd/release-tool versions --field config)"
          DB_SCHEMA_VERSION="$(go run ./tools/cmd/release-tool versions --field database)"
          PLUGIN_PROTOCOL_VERSION="$(go run ./tools/cmd/release-tool versions --field plugin-protocol)"
          go run ./tools/cmd/release-tool metadata \
            --version "$VERSION" \
            --channel "$RELEASE_CHANNEL" \
            --git-commit "$GIT_COMMIT" \
            --config-schema-version "$CONFIG_SCHEMA_VERSION" \
            --db-schema-version "$DB_SCHEMA_VERSION" \
            --plugin-protocol-version "$PLUGIN_PROTOCOL_VERSION" \
            --release-notes-ref "$RELEASE_NOTES_REF" \
            --download-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}" \
            --sidecar dist/downloads/package-windows-x64-full/RayleaBot-v${VERSION}-windows-x64-full.zip.artifact.json \
            --sidecar dist/downloads/package-linux-x64-full/RayleaBot-v${VERSION}-linux-x64-full.tar.gz.artifact.json \
            --sidecar dist/downloads/package-macos-arm64-full/RayleaBot-v${VERSION}-macos-arm64-full.tar.gz.artifact.json \
            --sidecar dist/downloads/package-linux-x64-server/RayleaBot-v${VERSION}-linux-x64-server.tar.gz.artifact.json \
            --output-dir dist/release

      - name: Upload release metadata
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          if-no-files-found: error
          path: |
            dist/release/release_manifest.v2.json

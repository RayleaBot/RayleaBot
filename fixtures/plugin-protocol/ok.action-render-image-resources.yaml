contract: contracts/plugin-protocol.schema.json
case: ok
frames:
  - protocol_version: "1"
    type: action
    timestamp: 1710000430
    plugin_id: subscription-hub
    request_id: local_render_resources_0001
    parent_request_id: event_subscription_update_0001
    action: render.image
    data:
      template: weibo-update
      output: png
      resources:
        - id: media-0
          url: https://wx2.sinaimg.cn/large/fixture-image.jpg
          referer: https://weibo.com/
      data:
        media_items:
          - resource_id: media-0
            fallback: assets/grid.svg
expect:
  valid: true
  notes:
    - Resources carry only HTTPS source metadata; the platform owns downloaded bytes and temporary file paths.
    - A caller using resources must declare both render.image and http.request, and every target must be listed in http_hosts.

contract: contracts/web-api.openapi.yaml
case: invalid
description: Installation without trusted-code confirmation is rejected before the package is read.
request:
  method: POST
  path: /api/plugins/install
  body:
    source_type: local_zip
    source: C:/plugins/weather.zip
    trusted_code_confirmed: false
response:
  status: 403
  body:
    error:
      code: plugin.trusted_code_confirmation_required
      message: 必须确认该插件将作为完全可信的本地代码运行
      request_id: req_fixture_install_untrusted
expect:
  valid: false

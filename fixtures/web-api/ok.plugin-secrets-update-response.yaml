contract: contracts/web-api.openapi.yaml
case: ok
description: Plugin secret overwrites return changed keys and configured state without echoing plaintext.
request:
  method: PUT
  path: /api/plugins/subscription-hub/secrets
  body:
    values:
      bili_token_primary: fixture-secret-value
response:
  status: 200
  body:
    plugin_id: subscription-hub
    changed_keys:
      - bili_token_primary
    configured:
      bili_token_primary: true
expect:
  valid: true

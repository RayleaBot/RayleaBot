contract: contracts/web-api.openapi.yaml
case: ok
description: System status query returns running state with basic operational counters.
request:
  method: GET
  path: /api/system/status
response:
  status: 200
  body:
    status: running
    adapters:
      - id: onebot11
        protocol: onebot11
        enabled: true
        state: connected
    active_plugins: 1
    running_plugins: 1
    failed_plugins: 0
    db_schema_version: "000001"
    uptime_seconds: 3600
    health:
      status: degraded
      reason: 浏览器运行资源缺失
      reason_codes:
        - platform.resource_missing
      checks:
        config: ok
        database: ok
        runtime: ok
        render: resource_missing
      issues:
        - code: platform.resource_missing
          runtime_resources: [chromium]
          severity: warning
          summary: 浏览器运行资源缺失
          remediation: 运行运行时准备任务。
expect:
  valid: true

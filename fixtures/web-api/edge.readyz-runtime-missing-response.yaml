contract: contracts/web-api.openapi.yaml
case: edge
description: 仅 FFmpeg 准备失败也会报告可处理的运行资源问题。
request:
  method: GET
  path: /readyz
response:
  status: 200
  body:
    status: degraded
    reason: FFmpeg 媒体工具准备失败。
    reason_codes:
      - platform.resource_missing
    checks:
      database: ok
      runtime: resource_missing
      render: ok
    issues:
      - code: platform.resource_missing
        severity: warning
        summary: FFmpeg 媒体工具准备失败。
        remediation: 请重新准备 FFmpeg 运行环境。
        runtime_resources: [ffmpeg]
expect:
  valid: true

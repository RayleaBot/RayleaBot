contract: contracts/web-api.openapi.yaml
case: edge
description: Store installation fails when no artifact exists for the current platform.
request:
  method: POST
  path: /api/plugin-store/plugins/raylea.fortune/install
  body:
    source_id: official
    trusted_code_confirmed: true
response:
  status: 409
  body:
    error:
      code: plugin.store_release_unavailable
      message: 当前平台没有可安装的插件商店产物
      request_id: req_fixture_store_release
expect:
  valid: true

contract: contracts/web-api.openapi.yaml
case: invalid
description: Governance whitelist snapshot requires a valid management session.
request:
  method: GET
  path: /api/governance/whitelist
  headers:
    Authorization: Bearer invalid_token
response:
  status: 401
  body:
    error:
      code: permission.authentication_required
      message: "请求认证未通过"
      message_key: errors.permission.authentication_required
      request_id: req_governance_whitelist_unauthorized
expect:
  valid: true

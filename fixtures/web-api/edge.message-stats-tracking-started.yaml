  bucket, omits the comparison, and lists a configured connection that has not
  received anything yet with zero counts and no last_received_at.
request:
  method: GET
  path: /api/system/message-stats?start_at=2026-09-24T16:00:00Z&end_at=2026-10-01T16:00:00Z&granularity=day
response:
  status: 200
  body:
    granularity: day
    timezone: Asia/Shanghai
    start_at: '2026-09-24T16:00:00Z'
    end_at: '2026-10-01T16:00:00Z'
    as_of: '2026-10-01T06:30:00Z'
    tracking_started_at: '2026-10-01T01:11:00Z'
    buckets:
      - '2026-09-30T16:00:00Z'
    totals:
      received: 228
      sent: 61
    connections:
      - adapter_id: onebot11
        protocol: onebot11
        configured: true
        received: [228]
        sent: [61]
        totals:
          received: 228
          sent: 61
        last_received_at: '2026-10-01T06:29:12Z'
      - adapter_id: qq-official
        protocol: qqofficial
        configured: true
        received: [0]
        sent: [0]
        totals:
          received: 0
          sent: 0
    incidents: []
    incidents_truncated: false
expect:
  valid: true

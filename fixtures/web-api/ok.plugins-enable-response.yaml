contract: contracts/web-api.openapi.yaml
case: ok
description: Enable is synchronous and returns the latest plugin state.
request:
  method: POST
  path: /api/plugins/weather/enable
response:
  status: 200
  body:
    plugin:
      id: weather
      name: Weather
      role: community
      state: starting
      source:
        root: plugins/installed
        package_source_type: local_zip
        package_source_ref: C:/plugins/weather.zip
        verified: false
      trust:
        level: unverified
      webhooks: []
      commands:
        - id: weather
          name: 天气查询
          effective_names: [weather, tq, 天气]
          description: 查询天气
          usage: weather <城市>
          permission: everyone
          trigger:
            type: exact
            names: [weather, tq, 天气]
      command_prefixes: ["/"]
      dedicated_command_prefixes: []
      command_groups:
        - id: query
          title: 查询
          commands: [weather]
      help: {}
      command_conflicts: []
expect:
  valid: true
  notes:
    - No task_id is returned.
    - state may be starting while the runtime is still booting.

contract: contracts/web-api.openapi.yaml
case: invalid
description: A valid configuration update returns a server error when persistence
  fails; no new revision is committed.
request:
  method: PUT
  path: /api/config
  body:
    schema_version: '4'
    server:
      host: 127.0.0.1
      port: 8081
    adapters:
    - id: onebot11
      type: onebot11
      enabled: false
      onebot11:
        reverse_ws:
          enabled: false
          url: ''
          access_token: reverse-secret
          access_token_query_compat: false
        forward_ws:
          enabled: false
          url: ''
          access_token: forward-secret
          access_token_query_compat: false
        http_api:
          enabled: false
          url: ''
          access_token: http-secret
        webhook:
          enabled: false
          url: ''
          access_token: webhook-secret
          access_token_query_compat: false
    database:
      engine: sqlite
      path: data/rayleabot.db
    command:
      prefixes:
      - /
    builtin_features:
      menu:
        commands:
        - help
        - 帮助
        prefixes:
        - '#'
    admin:
      super_admins: []
      session_ttl_days: 7
      session_absolute_ttl_days: 30
      sliding_renewal: true
      max_sessions: 3
      login_fail_limit: 5
      login_fail_window_seconds: 300
    permission:
      default_level: everyone
    render:
      worker_count: 1
      browser_args:
      - --disable-gpu
      browser_path: ''
      default_output: png
      device_scale_percent: 100
      timeout_seconds: 30
      queue_wait_timeout_seconds: 15
      queue_max_length: 32
      footer_template: Created By RayleaBot {{rayleabot_version}} & Plugin {{plugin_name}}
        {{plugin_version}}
    scheduler:
      timezone: Asia/Shanghai
    runtime:
      plugin_init_timeout_seconds: 30
      plugin_init_max_total_seconds: 300
      plugin_event_timeout_seconds: 60
      max_pending_events_per_plugin: 16
      max_pending_control_events_per_plugin: 4
      ipc_pending_actions_max: 256
      ipc_action_burst_limit: 100/1s
      stderr_rate_limit_bytes_per_second: 262144
      max_concurrent_tasks_per_plugin: 4
      crash_backoff_initial_seconds: 2
      crash_backoff_max_seconds: 60
      shutdown_grace_seconds: 10
      ipc_message_max_bytes: 8388608
    storage:
      kv_value_max_bytes: 65536
      kv_total_limit_mb: 16
      file_max_bytes: 10485760
      plugin_workdir_soft_limit_mb: 256
    data:
      download_cache_retention_days: 15
    log:
      level: debug
      retention_days: 7
      rate_limit_per_plugin: 200/10s
    message:
      rate_limit_per_plugin: 20/10s
      rate_limit_per_target: 5/5s
      circuit_breaker_seconds: 30
    user:
      command_rate_limit: 10/60s
      cooldown_reply: true
    group:
      command_rate_limit: 30/60s
    adapter:
      connect_timeout_seconds: 15
      reconnect_initial_seconds: 2
      reconnect_multiplier: 2
      reconnect_max_seconds: 120
      reconnect_jitter_ratio: 0.2
    http:
      timeout_seconds: 10
      max_retries: 2
      max_response_body_bytes: 4194304
      allow_private_hosts: []
    web:
      exposure_mode: localhost_only
      plugin_ui_origin_template: ''
      public_origin: ''
      setup_local_only: true
      trusted_proxy_cidrs: []
response:
  status: 500
  body:
    error:
      code: platform.internal_error
      message: 平台内部错误
      message_key: errors.platform.internal_error
      request_id: req_config_save
expect:
  valid: true

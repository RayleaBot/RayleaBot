contract: contracts/web-api.openapi.yaml
case: invalid
description: An incorrect current password rejects the change and preserves the session.
request:
  method: PUT
  path: /api/account/credentials
  body:
    current_secret: fixture-only-incorrect-password
    new_secret: fixture-only-new-password
response:
  status: 403
  body:
    error:
      code: permission.current_secret_invalid
      message: 当前密码不正确
      message_key: errors.permission.current_secret_invalid
      request_id: req_account_credentials_fixture
expect:
  valid: true

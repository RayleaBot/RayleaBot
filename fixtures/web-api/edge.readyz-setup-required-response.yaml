contract: contracts/web-api.openapi.yaml
case: edge
description: 管理员初始化前仅报告初始化问题，不输出未执行的检查。
request:
  method: GET
  path: /readyz
response:
  status: 503
  body:
    status: setup_required
    reason: 需要先完成管理员初始化
    issues:
      - code: setup.required
        severity: error
        summary: 需要先完成管理员初始化
        remediation: 请先完成管理员初始化，然后再使用管理入口。
expect:
  valid: true

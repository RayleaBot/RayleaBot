contract: contracts/web-api.openapi.yaml
case: ok
description: Plugin detail may expose multiple plugin-local management page entries.
request:
  method: GET
  path: /api/plugins/example-config-panel
response:
  status: 200
  body:
    plugin:
      id: example-config-panel
      name: Example Config Panel
      role: community
      version: 0.2.0
      description: Native example plugin demonstrating config snapshots and writes.
      author: raylea
      license: MIT
      permissions: {}
      webhooks: []
      management_ui:
        entry: ui/index.html
        pages:
          - id: config
            label: 配置页面
          - id: secrets
            label: 密钥设置
      state: disabled
      source:
        root: examples/plugins
        package_source_type: local_directory
        package_source_ref: examples/plugins/example-config-panel
        verified: true
      trust:
        level: third_party
        label: 示例
      commands:
        - id: config-panel
          name: 配置面板
          effective_names: [config_panel]
          description: Read and update plugin-local config values.
          usage: /config_panel [city]
          permission: everyone
          trigger:
            type: exact
            names: [config_panel]
      command_groups:
        - id: settings
          title: 设置
          commands: [config-panel]
      help: {}
      command_conflicts: []
expect:
  valid: true

contract: contracts/web-api.openapi.yaml
case: edge
description: Explicitly persisting the effective default creates an override without a config.changed event.
request:
  method: PUT
  path: /api/plugins/example-config-panel/settings
  body:
    values:
      default_city: 北京
response:
  status: 200
  body:
    plugin_id: example-config-panel
    changed_keys: []
    values:
      default_city: 北京
expect:
  valid: true

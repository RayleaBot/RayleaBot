contract: contracts/web-api.openapi.yaml
case: invalid
description: Credential validation rejects an account without a saved credential.
request:
  method: POST
  path: /api/third-party/accounts/weibo/missing/validate
response:
  status: 404
  body:
    error:
      code: platform.third_party_account_not_found
      message: 三方账号不存在或尚未配置凭据
      message_key: errors.platform.third_party_account_not_found
      request_id: req_third_party_account_missing
expect:
  valid: true

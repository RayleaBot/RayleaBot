contract: contracts/web-api.openapi.yaml
case: ok
description: Local Launcher status query returns the current system status snapshot.
request:
  method: GET
  path: /api/launcher/status
  headers:
    X-Raylea-Launcher-Control: fixture-control-token-not-a-real-secret
response:
  status: 200
  body:
    shutdown_budget_seconds: 57
    status: running
    adapters:
      - id: onebot11
        protocol: onebot11
        enabled: true
        state: connected
    active_plugins: 1
    running_plugins: 1
    failed_plugins: 0
    db_schema_version: "000001"
    uptime_seconds: 3600
expect:
  valid: true

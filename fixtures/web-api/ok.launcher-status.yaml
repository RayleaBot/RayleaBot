contract: contracts/web-api.openapi.yaml
case: ok
description: Local Launcher status query returns the current system status snapshot.
request:
  method: GET
  path: /api/launcher/status
  headers:
    X-Raylea-Launcher-Control: fixture-control-token-not-a-real-secret
response:
  status: 200
  body:
    status: running
    active_plugins: 1
    running_plugins: 1
    failed_plugins: 0
    db_schema_version: '000004'
    uptime_seconds: 3600
    recovery_summary:
      status: compatible
      phase: post_startup
      operation: upgrade
      created_at: 2026-04-02 08:00:00+00:00
      updated_at: 2026-04-02 08:01:00+00:00
      source_core_version: 0.1.0
      target_core_version: 0.2.0
      source_config_schema_version: '2'
      target_config_schema_version: '2'
      source_db_schema_version: '000004'
      target_db_schema_version: '000004'
    adapters:
    - id: onebot11
      protocol: onebot11
      enabled: true
      state: connected
expect:
  valid: true

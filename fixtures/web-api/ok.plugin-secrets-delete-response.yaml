contract: contracts/web-api.openapi.yaml
case: ok
description: Plugin secret deletion is an explicit operation and returns only configured state.
request:
  method: DELETE
  path: /api/plugins/subscription-hub/secrets
  body:
    keys:
      - bili_token_old
response:
  status: 200
  body:
    plugin_id: subscription-hub
    changed_keys:
      - bili_token_old
    configured:
      bili_token_old: false
expect:
  valid: true

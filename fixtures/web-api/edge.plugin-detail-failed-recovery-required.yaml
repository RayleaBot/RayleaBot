contract: contracts/web-api.openapi.yaml
case: edge
description: Plugin detail surfaces recovery diagnostics while the runtime needs manual recovery.
request:
  method: GET
  path: /api/plugins/weather
response:
  status: 200
  body:
    plugin:
      id: weather
      name: Weather
      role: community
      state: failed
      state_diagnosis:
        kind: recovery_required
        summary: 插件运行时需要人工恢复
        entered_at: '2026-05-13T08:00:00Z'
        crash_count: 5
        last_error_code: plugin.internal_error
        last_error_message: 插件运行时异常退出
        recoverable: true
      source:
        root: plugins/installed
        package_source_type: local_zip
        package_source_ref: C:/plugins/weather.zip
        verified: false
      trust:
        level: unverified
      permissions:
        message.send: true
      webhooks: []
      commands:
        - id: weather
          name: 天气查询
          effective_names: [weather, tq, 天气]
          description: 查询天气
          usage: weather <城市>
          permission: everyone
          trigger:
            type: exact
            names: [weather, tq, 天气]
      command_groups:
        - id: query
          title: 查询
          commands: [weather]
      help: {}
      command_conflicts: []
expect:
  valid: true
  notes:
    - state_diagnosis contains the recovery summary for failed plugins that need manual recovery.
    - last_error_message is redacted before reaching this surface.

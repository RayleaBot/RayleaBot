contract: contracts/web-api.openapi.yaml
case: edge
description: Readyz degraded response reports a missing render runtime resource.
request:
  method: GET
  path: /readyz
response:
  status: 200
  body:
    status: degraded
    reason: 浏览器运行资源缺失
    reason_codes:
      - platform.resource_missing
    checks:
      config: ok
      database: ok
      runtime: ok
      render: resource_missing

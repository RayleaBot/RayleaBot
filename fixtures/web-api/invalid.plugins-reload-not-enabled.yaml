contract: contracts/web-api.openapi.yaml
case: invalid
description: Reload is rejected when the plugin is disabled.
request:
  method: POST
  path: /api/plugins/weather/reload
response:
  status: 409
  body:
    error:
      code: platform.state_conflict
      message: "当前状态不允许执行该操作"
      message_key: errors.platform.state_conflict
      request_id: req_001
      details:
        plugin_id: weather
expect:
  valid: true
  notes:
    - Reload requires an enabled plugin.

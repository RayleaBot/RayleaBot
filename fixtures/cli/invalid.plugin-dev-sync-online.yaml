contract: contracts/cli-commands.yaml#commands.plugin.subcommands.dev-sync
case: invalid
input:
  command: raylea plugin dev-sync --artifact .tmp/plugin-dev/windows-x64/raylea.echo --source ../RayleaBotPlugins/plugin-echo
  mode: online
expect:
  valid: false
  exit_code: 1
  notes:
    - Development sync requires the server database lock and therefore runs before startup or during a coordinated development restart; the CLI reports the storage error on stderr and exits 1 without a machine-readable error code.

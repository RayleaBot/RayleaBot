contract: contracts/error-codes.yaml
case: edge
description: Applicability boundary examples for task timeout and permission admission errors.
input:
  cases:
    - code: permission.unavailable
      applies_to: [logs]
      example_surface: chat admission denied after a governance storage read failed
    - code: platform.task_timeout
      applies_to: [http, websocket, task]
      example_surface: asynchronous task execution
    - code: permission.not_whitelisted
      applies_to: [plugin_protocol, logs]
      example_surface: command dispatch admission with whitelist enabled
expect:
  valid: true

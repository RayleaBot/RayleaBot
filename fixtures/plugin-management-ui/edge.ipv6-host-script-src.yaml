contract: contracts/plugin-management-ui.yaml
case: edge
description: A request through an IPv6 literal host cannot name that host in CSP, so script-src falls back to same-origin scripts.
request:
  method: GET
  host: "[::1]:8080"
  path: /plugin-ui/example-config-panel/index.html
response:
  status: 200
  content_type: text/html
  content_security_policy_script_src: "'self'"
expect:
  valid: true
